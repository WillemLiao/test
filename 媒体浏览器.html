<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地媒体浏览器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a14;
    color: #d4cfc4;
    font-family: 'Noto Sans SC', sans-serif;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 240px;
    min-width: 240px;
    background: linear-gradient(180deg, #0f0f1e 0%, #14142a 100%);
    border-right: 1px solid rgba(255,255,255,0.04);
    display: flex;
    flex-direction: column;
    padding: 16px 0;
  }
  .sidebar-title {
    font-size: 0.75em;
    font-weight: 700;
    color: #e3a869;
    letter-spacing: 0.1em;
    text-align: center;
    padding: 0 14px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .add-btn {
    margin: 12px 14px 8px;
    padding: 8px 0;
    border: 1px dashed rgba(227,168,105,0.3);
    border-radius: 6px;
    background: transparent;
    color: #e3a869;
    font-size: 0.78em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .add-btn:hover { background: rgba(227,168,105,0.08); border-color: #e3a869; }
  .folder-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .folder-list::-webkit-scrollbar { width: 2px; }
  .folder-list::-webkit-scrollbar-thumb { background: #334; border-radius: 1px; }
  .folder-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    font-size: 0.78em;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 2px solid transparent;
    color: #667788;
  }
  .folder-item:hover { background: rgba(255,255,255,0.02); color: #99aabb; }
  .folder-item.active {
    border-left-color: #e3a869;
    background: rgba(227,168,105,0.05);
    color: #d4cfc4;
  }
  .folder-item .icon { font-size: 1em; flex-shrink: 0; }
  .folder-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder-item .del {
    font-size: 0.85em;
    color: #445;
    cursor: pointer;
    transition: color 0.2s;
    flex-shrink: 0;
    padding: 0 2px;
  }
  .folder-item .del:hover { color: #e86969; }
  .sidebar-footer {
    padding: 10px 14px;
    font-size: 0.5em;
    color: #445;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.04);
  }

  /* ===== Main ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .toolbar {
    display: flex;
    align-items: center;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    gap: 12px;
    flex-wrap: wrap;
    min-height: 48px;
  }
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.78em;
    color: #667788;
    flex-wrap: wrap;
  }
  .bc-item {
    color: #667788;
    cursor: pointer;
    transition: color 0.2s;
    padding: 2px 4px;
    border-radius: 3px;
  }
  .bc-item:hover { color: #e3a869; background: rgba(227,168,105,0.06); }
  .bc-item.root { color: #99aabb; font-weight: 500; }
  .bc-sep { color: #445; font-size: 0.7em; }
  .bc-item.current { color: #d4cfc4; cursor: default; }
  .bc-item.current:hover { background: transparent; }

  .grid {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .grid::-webkit-scrollbar { width: 3px; }
  .grid::-webkit-scrollbar-thumb { background: #334; border-radius: 2px; }
  .grid::-webkit-scrollbar-track { background: transparent; }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: #445;
    font-size: 0.85em;
  }
  .empty-state .big { font-size: 2em; margin-bottom: 10px; display: block; color: #334; }
  .empty-state p { margin-top: 4px; }

  /* ===== Grid items ===== */
  .grid-item {
    border-radius: 8px;
    overflow: hidden;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: all 0.25s;
    aspect-ratio: 1;
    position: relative;
  }
  .grid-item:hover {
    border-color: rgba(227,168,105,0.3);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .grid-item.folder-item-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: #667788;
    font-size: 0.75em;
    aspect-ratio: 1;
  }
  .grid-item.folder-item-grid .folder-icon { font-size: 2.4em; }
  .grid-item.folder-item-grid .folder-name {
    text-align: center;
    padding: 0 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .grid-item img, .grid-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .grid-item .vid-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    border: 2px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center; justify-content: center;
    pointer-events: none;
    transition: all 0.2s;
  }
  .grid-item .vid-overlay::after {
    content: '';
    display: block;
    width: 0; height: 0;
    border-left: 12px solid rgba(255,255,255,0.85);
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    margin-left: 3px;
  }
  .grid-item:hover .vid-overlay { background: rgba(227,168,105,0.5); border-color: #e3a869; }
  .grid-item .item-name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 4px 8px;
    font-size: 0.65em;
    color: #d4cfc4;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ===== Lightbox ===== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .lightbox.show { display: flex; }
  .lightbox .close-btn {
    position: absolute;
    top: 16px; right: 20px;
    color: #667788;
    font-size: 1.4em;
    cursor: pointer;
    transition: color 0.2s;
    background: none;
    border: none;
    font-family: inherit;
    padding: 4px 8px;
    z-index: 2;
  }
  .lightbox .close-btn:hover { color: #e3a869; }
  .lightbox .lb-content {
    max-width: 90vw;
    max-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox .lb-content img {
    max-width: 100%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 4px;
  }
  .lightbox .lb-content video {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 4px;
  }
  .lightbox .lb-name {
    margin-top: 12px;
    font-size: 0.8em;
    color: #667788;
  }
  .lightbox .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    color: #667788;
    font-size: 1.6em;
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .lightbox .nav-btn:hover { background: rgba(227,168,105,0.1); color: #e3a869; border-color: #e3a869; }
  .lightbox .nav-btn.prev { left: 20px; }
  .lightbox .nav-btn.next { right: 20px; }

  /* ===== Error ===== */
  .error-msg {
    padding: 14px 20px;
    text-align: center;
    color: #e86969;
    font-size: 0.8em;
    background: rgba(232,105,105,0.06);
    border-bottom: 1px solid rgba(232,105,105,0.1);
  }

  @media (max-width: 900px) {
    .sidebar { width: 200px; min-width: 200px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; padding: 10px; }
  }
  @media (max-width: 600px) {
    body { flex-direction: column; }
    .sidebar {
      width: 100%;
      min-width: unset;
      flex-direction: row;
      flex-wrap: wrap;
      padding: 8px;
      border-right: none;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      max-height: 120px;
      overflow-y: auto;
    }
    .sidebar-title { display: none; }
    .add-btn { margin: 0; flex-shrink: 0; padding: 6px 10px; font-size: 0.7em; }
    .folder-list { display: flex; flex-wrap: wrap; gap: 4px; padding: 0; overflow-y: visible; flex: 1; }
    .folder-item { padding: 4px 8px; font-size: 0.7em; border-left: none; border-bottom: 2px solid transparent; }
    .folder-item.active { border-left-color: transparent; border-bottom-color: #e3a869; }
    .sidebar-footer { display: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; padding: 8px; }
    .lightbox .nav-btn { width: 34px; height: 34px; font-size: 1.2em; }
    .lightbox .nav-btn.prev { left: 6px; }
    .lightbox .nav-btn.next { right: 6px; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-title">本地媒体浏览器</div>
  <button class="add-btn" id="addBtn">📁 添加文件夹</button>
  <div class="folder-list" id="folderList"></div>
  <div class="sidebar-footer">支持图片 · 视频</div>
</div>

<div class="main">
  <div class="toolbar">
    <div class="breadcrumb" id="breadcrumb"></div>
  </div>
  <div id="errorMsg" class="error-msg" style="display:none"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="close-btn" id="lbClose">✕</button>
  <button class="nav-btn prev" id="lbPrev">‹</button>
  <button class="nav-btn next" id="lbNext">›</button>
  <div class="lb-content" id="lbContent"></div>
  <div class="lb-name" id="lbName"></div>
</div>

<script>
(function() {
  'use strict';

  if (!window.showDirectoryPicker) {
    document.getElementById('errorMsg').textContent = '您的浏览器不支持目录选择器。请使用最新版 Chrome 或 Edge。';
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('addBtn').disabled = true;
    return;
  }

  // ===== State =====
  var folders = [];          // [{id, name, handle}]
  var currentFolderId = null;
  var currentDirHandle = null;  // FileSystemDirectoryHandle for current browsing
  var currentPath = [];        // [{handle, name}] breadcrumb trail
  var currentFiles = [];       // [{name, handle, kind, url}]
  var lbItems = [];            // [{url, name, type}] for lightbox navigation
  var lbIndex = -1;

  // ===== DOM refs =====
  var folderListEl = document.getElementById('folderList');
  var gridEl = document.getElementById('grid');
  var breadcrumbEl = document.getElementById('breadcrumb');
  var addBtn = document.getElementById('addBtn');
  var lightbox = document.getElementById('lightbox');
  var lbContent = document.getElementById('lbContent');
  var lbName = document.getElementById('lbName');
  var lbClose = document.getElementById('lbClose');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var errorMsg = document.getElementById('errorMsg');

  // ===== IndexedDB =====
  function openDB() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open('MediaBrowser', 1);
      req.onupgradeneeded = function() {
        req.result.createObjectStore('folders', { keyPath: 'id' });
      };
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  }

  function dbSave(folder) {
    return openDB().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction('folders', 'readwrite');
        tx.objectStore('folders').put(folder);
        tx.oncomplete = function() { resolve(); db.close(); };
        tx.onerror = function() { reject(tx.error); db.close(); };
      });
    });
  }

  function dbDelete(id) {
    return openDB().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction('folders', 'readwrite');
        tx.objectStore('folders').delete(id);
        tx.oncomplete = function() { resolve(); db.close(); };
        tx.onerror = function() { reject(tx.error); db.close(); };
      });
    });
  }

  function dbGetAll() {
    return openDB().then(function(db) {
      return new Promise(function(resolve, reject) {
        var tx = db.transaction('folders', 'readonly');
        var req = tx.objectStore('folders').getAll();
        req.onsuccess = function() { resolve(req.result || []); db.close(); };
        req.onerror = function() { reject(req.error); db.close(); };
      });
    });
  }

  // ===== Helpers =====
  function isImage(name) {
    return /\.(jpe?g|png|gif|bmp|webp|svg|avif)$/i.test(name);
  }
  function isVideo(name) {
    return /\.(mp4|webm|mov|avi|mkv|flv|wmv)$/i.test(name);
  }
  function isMedia(name) {
    return isImage(name) || isVideo(name);
  }
  function ext(name) {
    var i = name.lastIndexOf('.');
    return i > 0 ? name.slice(i).toLowerCase() : '';
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }
  function hideError() {
    errorMsg.style.display = 'none';
  }

  // ===== Render sidebar =====
  function renderSidebar() {
    folderListEl.innerHTML = '';
    folders.forEach(function(f) {
      var div = document.createElement('div');
      div.className = 'folder-item' + (f.id === currentFolderId ? ' active' : '');
      div.innerHTML = '<span class="icon">📂</span><span class="name">' + escapeHtml(f.name) + '</span><span class="del" data-id="' + f.id + '">✕</span>';
      div.addEventListener('click', function(e) {
        if (e.target.classList.contains('del')) return;
        openFolder(f.id);
      });
      folderListEl.appendChild(div);
    });
    // del handler
    folderListEl.querySelectorAll('.del').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var id = el.getAttribute('data-id');
        removeFolder(id);
      });
    });
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ===== Folder management =====
  function addFolder(handle) {
    return handle.name ? handle.name : handle.name;
  }

  addBtn.addEventListener('click', async function() {
    hideError();
    try {
      var handle = await window.showDirectoryPicker({ mode: 'read' });
      var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      var folder = { id: id, name: handle.name, handle: handle };
      folders.push(folder);
      renderSidebar();
      await dbSave(folder).catch(function(e) {
        console.warn('IndexedDB save failed (permissions may not persist across sessions):', e);
      });
      openFolder(id);
    } catch (e) {
      if (e.name !== 'AbortError' && e.name !== 'SecurityError') {
        showError('选择文件夹失败: ' + e.message);
      }
    }
  });

  function removeFolder(id) {
    var wasCurrent = id === currentFolderId;
    folders = folders.filter(function(f) { return f.id !== id; });
    dbDelete(id).catch(function(e) { console.warn('IndexedDB delete failed:', e); });
    if (wasCurrent) {
      currentFolderId = null;
      currentDirHandle = null;
      currentPath = [];
      currentFiles = [];
      if (folders.length > 0) {
        openFolder(folders[0].id);
      } else {
        renderSidebar();
        renderBreadcrumb();
        renderGrid();
      }
    } else {
      renderSidebar();
    }
  }

  // ===== Open folder =====
  async function openFolder(id) {
    hideError();
    var folder = folders.find(function(f) { return f.id === id; });
    if (!folder) return;
    currentFolderId = id;
    currentDirHandle = folder.handle;
    currentPath = [{ handle: folder.handle, name: folder.name }];
    renderSidebar();
    await browseDir(folder.handle);
  }

  async function browseDir(handle) {
    try {
      var perm = await handle.queryPermission({ mode: 'read' });
      if (perm !== 'granted') {
        perm = await handle.requestPermission({ mode: 'read' });
        if (perm !== 'granted') {
          showError('没有读取权限');
          return;
        }
      }
      var entries = [];
      for await (var entry of handle.values()) {
        entries.push(entry);
      }
      // Sort: dirs first, then by name
      entries.sort(function(a, b) {
        var aIsDir = a.kind === 'directory';
        var bIsDir = b.kind === 'directory';
        if (aIsDir && !bIsDir) return -1;
        if (!aIsDir && bIsDir) return 1;
        return a.name.localeCompare(b.name);
      });
      currentFiles = [];
      for (var i = 0; i < entries.length; i++) {
        var entry = entries[i];
        if (entry.kind === 'directory') {
          currentFiles.push({ name: entry.name, handle: entry, kind: 'directory' });
        } else if (isMedia(entry.name)) {
          var file = await entry.getFile();
          var url = URL.createObjectURL(file);
          currentFiles.push({ name: entry.name, handle: entry, kind: isImage(entry.name) ? 'image' : 'video', url: url, file: file });
        }
      }
      renderBreadcrumb();
      renderGrid();
    } catch (e) {
      if (e.name === 'SecurityError' || e.name === 'NotAllowedError') {
        showError('权限被拒绝，请重新添加文件夹');
      } else {
        showError('读取失败: ' + e.message);
      }
    }
  }

  // ===== Breadcrumb =====
  function renderBreadcrumb() {
    breadcrumbEl.innerHTML = '';
    if (!currentDirHandle) {
      breadcrumbEl.innerHTML = '<span class="bc-item current">请选择文件夹</span>';
      return;
    }
    currentPath.forEach(function(p, i) {
      if (i > 0) {
        var sep = document.createElement('span');
        sep.className = 'bc-sep';
        sep.textContent = '›';
        breadcrumbEl.appendChild(sep);
      }
      var span = document.createElement('span');
      span.className = 'bc-item' + (i === currentPath.length - 1 ? ' current' : '') + (i === 0 ? ' root' : '');
      span.textContent = i === 0 ? '📂 ' + p.name : p.name;
      if (i < currentPath.length - 1) {
        (function(idx) {
          span.addEventListener('click', function() { goToPath(idx); });
        })(i);
      }
      breadcrumbEl.appendChild(span);
    });
    var count = currentFiles.filter(function(f) { return f.kind !== 'directory'; }).length;
    var dirCount = currentFiles.filter(function(f) { return f.kind === 'directory'; }).length;
    if (count > 0 || dirCount > 0) {
      var info = document.createElement('span');
      info.style.cssText = 'margin-left:auto;font-size:0.7em;color:#445;';
      info.textContent = dirCount + ' 文件夹 · ' + count + ' 个媒体';
      breadcrumbEl.appendChild(info);
    }
  }

  function goToPath(idx) {
    if (idx >= currentPath.length - 1) return;
    currentPath = currentPath.slice(0, idx + 1);
    browseDir(currentPath[idx].handle);
  }

  // ===== Grid =====
  function renderGrid() {
    gridEl.innerHTML = '';
    if (!currentDirHandle) {
      gridEl.innerHTML = '<div class="empty-state"><span class="big">📁</span>点击左侧"添加文件夹"选择本地目录<p>支持图片和视频文件</p></div>';
      return;
    }
    var items = currentFiles;
    if (items.length === 0) {
      gridEl.innerHTML = '<div class="empty-state"><span class="big">📭</span>此文件夹中没有媒体文件</div>';
      return;
    }
    // limit display
    var maxShow = 500;
    var overflow = items.length > maxShow ? items.length - maxShow : 0;
    if (overflow > 0) items = items.slice(0, maxShow);

    items.forEach(function(item, idx) {
      if (item.kind === 'directory') {
        var div = document.createElement('div');
        div.className = 'grid-item folder-item-grid';
        div.innerHTML = '<div class="folder-icon">📁</div><div class="folder-name">' + escapeHtml(item.name) + '</div>';
        div.addEventListener('click', function() {
          currentPath.push({ handle: item.handle, name: item.name });
          browseDir(item.handle);
        });
        gridEl.appendChild(div);
      } else if (item.kind === 'image') {
        var div = document.createElement('div');
        div.className = 'grid-item';
        var img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = item.name;
        // Create thumbnail from blob
        if (item.url) {
          img.src = item.url;
        }
        div.appendChild(img);
        var nameSpan = document.createElement('div');
        nameSpan.className = 'item-name';
        nameSpan.textContent = item.name;
        div.appendChild(nameSpan);
        div.addEventListener('click', function() { openLightbox(idx); });
        gridEl.appendChild(div);
      } else if (item.kind === 'video') {
        var div = document.createElement('div');
        div.className = 'grid-item';
        var vid = document.createElement('video');
        vid.preload = 'metadata';
        vid.muted = true;
        vid.playsInline = true;
        if (item.url) vid.src = item.url;
        var playBtn = document.createElement('div');
        playBtn.className = 'vid-overlay';
        div.appendChild(vid);
        div.appendChild(playBtn);
        var nameSpan = document.createElement('div');
        nameSpan.className = 'item-name';
        nameSpan.textContent = item.name;
        div.appendChild(nameSpan);
        div.addEventListener('click', function() { openLightbox(idx); });
        gridEl.appendChild(div);
      }
    });

    if (overflow > 0) {
      var more = document.createElement('div');
      more.className = 'empty-state';
      more.style.padding = '20px';
      more.textContent = '还有 ' + overflow + ' 个文件未显示（最多显示 ' + maxShow + ' 个）';
      gridEl.appendChild(more);
    }
  }

  // ===== Lightbox =====
  function openLightbox(idx) {
    // Collect only media files (not dirs)
    lbItems = [];
    currentFiles.forEach(function(f) {
      if (f.kind === 'image' || f.kind === 'video') {
        lbItems.push({ url: f.url, name: f.name, type: f.kind });
      }
    });
    if (lbItems.length === 0) return;
    // Find the index in lbItems
    var target = currentFiles[idx];
    lbIndex = -1;
    for (var i = 0; i < lbItems.length; i++) {
      if (lbItems[i].name === target.name && lbItems[i].url === target.url) {
        lbIndex = i;
        break;
      }
    }
    if (lbIndex < 0) lbIndex = 0;
    showLightboxItem();
    lightbox.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function showLightboxItem() {
    var item = lbItems[lbIndex];
    lbContent.innerHTML = '';
    lbName.textContent = item.name;
    if (item.type === 'image') {
      var img = document.createElement('img');
      img.src = item.url;
      img.alt = item.name;
      lbContent.appendChild(img);
    } else if (item.type === 'video') {
      var vid = document.createElement('video');
      vid.src = item.url;
      vid.controls = true;
      vid.autoplay = true;
      vid.style.maxWidth = '100%';
      vid.style.maxHeight = '85vh';
      lbContent.appendChild(vid);
    }
    lbPrev.style.display = lbItems.length > 1 ? 'flex' : 'none';
    lbNext.style.display = lbItems.length > 1 ? 'flex' : 'none';
  }

  function closeLightbox() {
    lightbox.classList.remove('show');
    document.body.style.overflow = '';
    lbContent.innerHTML = '';
  }

  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e) {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', function(e) {
    if (!lightbox.classList.contains('show')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') prevItem();
    if (e.key === 'ArrowRight') nextItem();
  });
  lbPrev.addEventListener('click', prevItem);
  lbNext.addEventListener('click', nextItem);

  function prevItem() {
    if (lbItems.length < 2) return;
    lbIndex = (lbIndex - 1 + lbItems.length) % lbItems.length;
    showLightboxItem();
  }
  function nextItem() {
    if (lbItems.length < 2) return;
    lbIndex = (lbIndex + 1) % lbItems.length;
    showLightboxItem();
  }

  // ===== Init: restore from IndexedDB =====
  async function init() {
    try {
      var saved = await dbGetAll();
      if (saved && saved.length > 0) {
        folders = saved;
        renderSidebar();
        // Try to open the first folder
        openFolder(folders[0].id);
        return;
      }
    } catch (e) {
      console.warn('IndexedDB restore failed:', e);
    }
    renderSidebar();
    renderBreadcrumb();
    renderGrid();
  }

  // Cleanup object URLs on page unload
  window.addEventListener('beforeunload', function() {
    // Nothing special needed; URLs will be freed on reload
  });

  init();
})();
</script>
