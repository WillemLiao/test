<div class="container">
<div class="hero"><div class="ch">CHAPTER 53</div><h1>理性佛教</h1><div class="sub">纳瓦尔宝典 · The Almanack of Naval Ravikant</div></div>
<div class="body">
  <div class="highlight">问题越古老，答案存世的时间越长。</div>
  <div class="qbox"><div class="big">智慧是一种知道个人行为的长期后果的思维能力。</div></div>
  <div class="sec-title">🧪 纳瓦尔的人生哲学</div>
  <div class="card"><div class="card-head">理性</div><div class="card-body">必须接受科学和进化论，拒绝所有无法亲自验证的理念。不可证伪的东西不能被视为基本真理。</div></div>
  <div class="card"><div class="card-head">佛教</div><div class="card-body">理解佛教所倡导的内在修行，以此让自己变得更快乐、更活在当下、更能控制情绪——成为一个更好的人。</div></div>
  <div class="qbox"><div class="big">二者并不矛盾，可以相辅相成：<br>进化论解释人类，佛教指引内心。</div></div>
  <div class="card"><div class="card-body" style="text-align:center;">要勇于尝试，亲自验证，始终保持怀疑精神，<br>沙里淘金，使其为我所用。</div></div>
</div>
<div class="footer">— 纳瓦尔宝典 · 第 53 章 —</div>
