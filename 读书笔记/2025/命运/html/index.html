<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命运 · 蔡崇达</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #f9f5ef;
    font-family: "Noto Serif SC","Source Han Serif SC","STSong","SimSun","Songti SC",serif;
    color: #2c2416;
    display: flex;
  }
  .sidebar {
    width: 220px; min-width: 220px;
    background: #f2ece4;
    border-right: 1px solid #ddd2c4;
    display: flex; flex-direction: column;
    overflow-y: auto;
    height: 100vh;
    position: fixed;
    z-index: 100;
  }
  .sidebar .title {
    text-align: center;
    padding: 24px 14px 16px;
    font-size: 18px;
    font-weight: 700;
    color: #c7823d;
    letter-spacing: 3px;
    border-bottom: 1px solid #ddd2c4;
  }
  .sidebar .title small {
    display: block;
    font-size: 12px;
    font-weight: 400;
    color: #8b7a65;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .sidebar .subtitle {
    text-align: center;
    padding: 8px 14px 10px;
    font-size: 12px;
    color: #8b7a65;
    border-bottom: 1px solid #ddd2c4;
    font-family: "Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  .ch-list { flex: 1; padding: 8px 0; }
  .ch-link {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    color: #5a4a3a;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.2s;
    border-left: 3px solid transparent;
    cursor: pointer;
    font-family: "Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  .ch-link:hover { background: rgba(199,130,61,0.06); color: #c7823d; border-left-color: #c7823d; }
  .ch-link.active { background: rgba(199,130,61,0.1); color: #c7823d; border-left-color: #c7823d; font-weight: 600; }
  .ch-link .num {
    width: 22px; height: 22px; border-radius: 50%;
    background: #e5ddd0; color: #8b7a65;
    font-size: 11px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-family: "Helvetica Neue",Arial,sans-serif;
  }
  .ch-link:hover .num { background: #c7823d; color: #fff; }
  .ch-link.active .num { background: #c7823d; color: #fff; }
  .sidebar .footer {
    padding: 12px;
    text-align: center;
    font-size: 11px;
    color: #b8aa96;
    border-top: 1px solid #ddd2c4;
    font-family: "Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  #viewer {
    flex: 1;
    border: none;
    margin-left: 220px;
    width: calc(100% - 220px);
    height: 100vh;
  }
  @media (max-width: 800px) {
    .sidebar { width: 180px; min-width: 180px; }
    #viewer { margin-left: 180px; width: calc(100% - 180px); }
    .sidebar .title { font-size: 15px; padding: 16px 10px 12px; }
    .ch-link { font-size: 13px; padding: 6px 12px; }
  }
  @media (max-width: 600px) {
    .sidebar { width: 100%; min-width: 0; height: auto; position: relative; border-right: none; border-bottom: 1px solid #ddd2c4; max-height: 50vh; }
    #viewer { margin-left: 0; width: 100%; height: calc(100vh - 50vh); }
    .ch-list { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; }
    .ch-link { flex: 0 0 auto; padding: 4px 10px; font-size: 12px; border-left: none; border-bottom: 2px solid transparent; }
    .ch-link:hover { border-left-color: transparent; border-bottom-color: #c7823d; }
    .ch-link.active { border-left-color: transparent; border-bottom-color: #c7823d; }
  }
</style>
</head>
<body>
<div class="sidebar">
  <div class="title">命运<small>蔡崇达</small></div>
  <div class="subtitle">她站在命运的入海口</div>
  <div class="ch-list" id="chList">
    <a class="ch-link" data-ch="4"><span class="num">4</span>开篇</a>
    <a class="ch-link" data-ch="5"><span class="num">5</span>回忆一 · 层层浪</a>
    <a class="ch-link" data-ch="6"><span class="num">6</span>回忆二 · 海上土</a>
    <a class="ch-link" data-ch="7"><span class="num">7</span>回忆三 · 田里花</a>
    <a class="ch-link" data-ch="8"><span class="num">8</span>回忆四 · 厕中佛</a>
    <a class="ch-link" data-ch="9"><span class="num">9</span>回忆五 · 天顶孔</a>
    <a class="ch-link" data-ch="10"><span class="num">10</span>后记</a>
    <a class="ch-link" data-ch="11"><span class="num">11</span>附录 · 皮囊</a>
  </div>
  <div class="footer">蔡崇达 · 命运</div>
</div>
<iframe id="viewer" src="ch04.html"></iframe>
<script>
  var links = document.querySelectorAll('.ch-link');
  var viewer = document.getElementById('viewer');
  function loadChapter(n) {
    viewer.src = 'ch' + String(n).padStart(2, '0') + '.html';
    links.forEach(function(l) { l.classList.remove('active'); });
    links.forEach(function(l) {
      if (l.getAttribute('data-ch') === String(n)) l.classList.add('active');
    });
    window.location.hash = n;
  }
  links.forEach(function(l) {
    l.addEventListener('click', function(e) {
      e.preventDefault();
      loadChapter(this.getAttribute('data-ch'));
    });
  });
  if (window.location.hash) {
    var n = window.location.hash.replace('#', '');
    if (n >= 4 && n <= 11) loadChapter(n);
  }
</script>
</body>
</html>
