<style>
:root{--ink:#20272b;--muted:#66747b;--paper:#fffdf7;--line:#d9d0c0;--gold:#c6903f;--pine:#244b40;--mist:#eef1ed;--rose:#b85d4c}*{box-sizing:border-box}html,body{height:100%}body{margin:0;color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#e8e5dc}header{height:82px;padding:12px 18px;border-bottom:1px solid rgba(36,75,64,.18);background:rgba(251,248,239,.96)}h1{margin:0;color:var(--pine);font-family:Georgia,"Times New Roman",serif;font-size:27px;letter-spacing:0}.sub{margin:4px 0 0;color:var(--muted);font-size:13px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.file-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}.file-controls input[type=file]{display:none}.path-input{display:inline-block;width:260px;height:36px;margin:0;border:1px solid var(--line);border-radius:8px;background:white;padding:0 10px;font-size:12px}.file-button{display:inline-flex;align-items:center;height:36px;margin:0;border-radius:8px;background:var(--pine);color:white;padding:0 12px;font-size:13px;font-weight:800;cursor:pointer}.file-controls button{height:36px;margin:0;padding:0 11px}.layout{height:calc(100vh - 82px);display:grid;grid-template-columns:minmax(0,1fr) 210px 410px}.layout.no-nav{grid-template-columns:minmax(0,1fr) 410px}.reader{overflow:auto;padding:24px 34px;border-right:1px solid rgba(36,75,64,.18);background:linear-gradient(180deg,#f6f2e9,#ece9df)}.reader.original-mode{padding:0;background:#f5f0e6}.reader-frame{display:block;width:100%;height:100%;border:0;background:white}.reader-placeholder{display:grid;place-items:center;min-height:100%;padding:32px;color:var(--muted);text-align:center}.reader-placeholder b{display:block;margin-bottom:6px;color:var(--pine);font-size:20px}.para{max-width:900px;margin:0 auto 18px;padding:16px 18px;border:1px solid rgba(217,208,192,.78);border-radius:8px;background:rgba(255,253,247,.86)}.en{font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.82}.cn{margin-top:10px;color:#76695f;line-height:1.7;font-size:14px}.section-nav.empty{display:none}.section-nav{overflow:auto;padding:24px 0;border-left:1px solid rgba(0,0,0,.06);border-right:1px solid rgba(0,0,0,.04);background:linear-gradient(180deg,#ebe3d2 0%,#e5dccb 100%)}.section-nav::-webkit-scrollbar{width:3px}.section-nav::-webkit-scrollbar-track{background:transparent}.section-nav::-webkit-scrollbar-thumb{background:#b8a695;border-radius:2px}.nav-title{text-align:center;padding:0 14px 16px;margin:0;color:#a8743a;font-size:12px;font-weight:800;letter-spacing:.1em;border-bottom:1px solid rgba(0,0,0,.06);background:transparent}.nav-progress{display:block;margin-top:3px;color:#7a6a7a;font-size:10px;font-weight:300;letter-spacing:0;line-height:1.35}.nav-link{width:100%;display:flex;align-items:center;gap:7px;margin:0;padding:6px 16px;border:0;border-left:2px solid transparent;border-radius:0;background:transparent;color:#7a6a7a;text-align:left;cursor:pointer;font-size:12px;font-weight:300;transition:all .2s}.nav-link:hover{color:#a8743a;background:rgba(227,168,105,.04);border-left-color:#a8743a}.nav-link .num{width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.04);color:#98826f;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}.nav-link:hover .num{background:#a8743a;color:#f5f0e6}.nav-link .name{font-size:12px;font-weight:300;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav-link .meta{display:none}.nav-link.past{opacity:.55}.nav-link.active{color:#a8743a;background:rgba(227,168,105,.08);border-left-color:#a8743a}.nav-link.active .num{background:#a8743a;color:#f5f0e6}.section-marker{max-width:900px;margin:0 auto 14px;padding:10px 14px;border-left:3px solid #a8743a;background:rgba(235,227,210,.46);border-radius:8px}.section-marker .kicker{color:#a8743a;font-size:11px;font-weight:800;letter-spacing:.05em}.section-marker h2{margin:2px 0 3px;color:var(--pine);font-size:18px}.section-marker p{margin:0;color:var(--muted);font-size:12px}.nav-footer{padding:14px;text-align:center;font-size:10px;color:#a89580;border-top:1px solid rgba(0,0,0,.06)}.side{overflow:auto;padding:14px;background:rgba(255,253,247,.9)}.card{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0;margin-bottom:12px;box-shadow:0 8px 22px rgba(30,35,34,.07);overflow:hidden}.card h2{margin:0 0 10px;color:var(--pine);font-size:18px}.card-toggle{width:100%;height:auto;margin:0;padding:12px 14px;border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--pine);display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:800;text-align:left}.card-toggle:hover{background:#f3eee4}.card-toggle .chevron{font-size:13px;line-height:1;transition:transform .18s}.card-body{padding:0 14px 14px}.card.collapsed .card-body{display:none}.card.collapsed .card-toggle{border-radius:8px}.card.collapsed .chevron{transform:rotate(-90deg)}.wordbook-card .card-body{max-height:38vh;overflow:auto}.sentence-card .card-body{max-height:46vh;overflow:auto}.selected{min-height:42px;padding:10px;border-radius:8px;background:#f0eee8;line-height:1.55;word-break:break-word}.small{color:var(--muted);font-size:13px;line-height:1.55}label{display:block;margin:10px 0 5px;color:var(--muted);font-size:13px;font-weight:700}input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:white;padding:10px;font:inherit}textarea{min-height:168px;max-height:42vh;resize:vertical;line-height:1.6;white-space:pre-wrap}button{border:0;border-radius:8px;padding:9px 12px;font-weight:800;color:white;background:var(--pine);cursor:pointer;margin:8px 6px 0 0}button.secondary{background:#e8e1d4;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.58;cursor:wait}.word-list{display:grid;gap:8px}.word-item{border:1px solid #e0d8cc;border-radius:8px;padding:9px;background:#fff;cursor:pointer}.word-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.word-item strong{color:var(--pine)}.word-delete{margin:0;padding:4px 7px;border-radius:6px;background:#f1ddd8;color:#8e3f32;border:1px solid #dfb8ae;font-size:12px}.word-item span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.word-item.mastered{opacity:.58}.hl-word{background:rgba(255,205,73,.72);border-radius:4px;padding:0 2px;cursor:pointer;box-shadow:inset 0 -1px 0 rgba(166,111,33,.35)}.hl-word.mastered{background:rgba(151,181,156,.3);border-bottom:1px dotted #5f8b63}.parse-block{border-left:4px solid var(--gold);padding-left:10px;margin:10px 0;line-height:1.7}.parse-block b{color:var(--pine)}.action-menu{position:fixed;z-index:30;display:none;min-width:124px;padding:6px;border:1px solid rgba(217,208,192,.95);border-radius:8px;background:#fffdf7;box-shadow:0 12px 32px rgba(0,0,0,.18)}.action-menu.show{display:grid;gap:4px}.action-menu button{margin:0;width:100%;padding:8px 10px;border-radius:6px;text-align:left;background:transparent;color:var(--ink);border:0}.action-menu button:hover{background:#eee7dc}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--pine);color:white;padding:10px 14px;border-radius:999px;display:none;z-index:10}.toast.show{display:block}.tip{position:fixed;z-index:20;max-width:320px;padding:10px 12px;border-radius:8px;background:#20272b;color:#fffdf7;box-shadow:0 10px 30px rgba(0,0,0,.25);line-height:1.45}.tip b{color:#ffd46b}.tip-speak,.tip-delete{margin:0 0 0 8px;padding:3px 7px;border-radius:6px;background:rgba(255,212,107,.16);color:#ffd46b;border:1px solid rgba(255,212,107,.35);font-size:12px}.tip-delete{background:rgba(241,221,216,.18);color:#ffb5a7;border-color:rgba(255,181,167,.35)}.tip-close{position:absolute;right:7px;top:6px;width:24px;height:24px;border:0;border-radius:50%;margin:0;padding:0;background:rgba(255,255,255,.14);color:#fffdf7;font-size:18px;line-height:22px;cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:0}.danger{background:var(--rose)}@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 360px}.section-nav{display:none}}@media(max-width:900px){header{height:auto}.topbar{align-items:flex-start;flex-direction:column}.file-controls{width:100%;flex-wrap:wrap}.layout{height:auto;min-height:calc(100vh - 82px);grid-template-columns:1fr}.reader{height:54vh;border-right:0;border-bottom:1px solid var(--line);padding:18px}.side{height:46vh}.en{font-size:18px}}
</style>

<body>
<header><div class="topbar"><div><h1>本地 HTML · 英语伴读</h1><p class="sub" id="docStatus">选择一本地 HTML，开始查词、拆句和高亮复习。</p></div><div class="file-controls"><label class="file-button" for="fileInput">打开本地 HTML</label><input id="fileInput" type="file" accept=".html,.htm,.xhtml,text/html,application/xhtml+xml"><button id="reloadCurrentBtn" class="secondary" type="button">重载当前文件</button><input id="pathInput" class="path-input" type="text" placeholder="粘贴本地 HTML 路径"><button id="openPathBtn" class="secondary" type="button">打开路径</button></div></div></header>
<div class="layout"><main class="reader" id="reader"></main><nav class="section-nav" id="sectionNav" aria-label="章节分段导航"></nav><aside class="side">
<section class="card selection-card" data-panel="selection"><button class="card-toggle" type="button" aria-expanded="true"><span>当前选择</span><span class="chevron">▾</span></button><div class="card-body"><div class="selected" id="selectionBox">还没有选择文本。</div><p class="small" id="selectionHelp">在左侧拖选英文单词或句子。</p><label>中文释义 / 你的理解</label><input id="meaningInput" placeholder="AI 查词后会自动填入"><label>例句、记忆提示或你的笔记</label><textarea id="noteInput"></textarea><div class="row"><button id="aiWordBtn">AI 查词</button><button id="parseBtn" class="secondary">AI 拆解句子</button></div></div></section>
<section class="card wordbook-card" data-panel="wordbook" data-default-collapsed="true"><button class="card-toggle" type="button" aria-expanded="false"><span>单词本</span><span class="chevron">▾</span></button><div class="card-body"><p class="small">单击条目可编辑，双击条目可标记掌握。高亮词可直接点击查看中文。</p><div class="word-list" id="wordList"></div></div></section>
<section class="card sentence-card" data-panel="sentence"><button class="card-toggle" type="button" aria-expanded="true"><span>长难句拆解</span><span class="chevron">▾</span></button><div class="card-body"><div id="sentenceBox" class="small">选中一句英文后点“AI 拆解句子”。</div></div></section>
</aside></div><div class="action-menu" id="actionMenu"><button id="menuWordBtn" type="button">AI 查词</button><button id="menuSentenceBtn" type="button">AI 拆句</button><button id="menuPronounceBtn" type="button">单词发音</button></div><div class="toast" id="toast"></div>
<script>
let PARAS=[];
let SECTIONS=[];
const STORAGE_KEY='nw_reader_companion_inline_ch01_v2';
let currentDoc={id:'',displayName:'未选择 HTML',source:'empty'};
let WORDBOOK_FILE='';
let highlightWords={};
const irregular={be:['am','is','are','was','were','been','being'],go:['goes','went','gone','going'],have:['has','had','having'],do:['does','did','done','doing'],lose:['loses','lost','losing'],feel:['feels','felt','feeling'],think:['thinks','thought','thinking'],bring:['brings','brought','bringing'],begin:['begins','began','begun','beginning'],send:['sends','sent','sending'],make:['makes','made','making'],come:['comes','came','coming'],see:['sees','saw','seen','seeing'],say:['says','said','saying']};
const API='http://127.0.0.1:8765';
const layout=document.querySelector('.layout');
const reader=document.getElementById('reader');
const fileInput=document.getElementById('fileInput');
const reloadCurrentBtn=document.getElementById('reloadCurrentBtn');
const pathInput=document.getElementById('pathInput');
const openPathBtn=document.getElementById('openPathBtn');
const docStatus=document.getElementById('docStatus');
const selectionBox=document.getElementById('selectionBox');
const selectionHelp=document.getElementById('selectionHelp');
const meaningInput=document.getElementById('meaningInput');
const noteInput=document.getElementById('noteInput');
const aiWordBtn=document.getElementById('aiWordBtn');
const parseBtn=document.getElementById('parseBtn');
const wordList=document.getElementById('wordList');
const sentenceBox=document.getElementById('sentenceBox');
const sectionNav=document.getElementById('sectionNav');
const actionMenu=document.getElementById('actionMenu');
const menuWordBtn=document.getElementById('menuWordBtn');
const menuSentenceBtn=document.getElementById('menuSentenceBtn');
const PANEL_STORAGE_KEY=STORAGE_KEY+'::rightPanels';
function setPanelCollapsed(card,collapsed){card.classList.toggle('collapsed',collapsed);const btn=card.querySelector('.card-toggle');if(btn)btn.setAttribute('aria-expanded',String(!collapsed))}
function initCollapsibleCards(){let saved={};try{saved=JSON.parse(localStorage.getItem(PANEL_STORAGE_KEY)||'{}')||{}}catch{}document.querySelectorAll('.card[data-panel]').forEach(card=>{const id=card.dataset.panel;const fallback=card.dataset.defaultCollapsed==='true';setPanelCollapsed(card,Object.prototype.hasOwnProperty.call(saved,id)?Boolean(saved[id]):fallback);const btn=card.querySelector('.card-toggle');if(btn)btn.onclick=()=>{const next=!card.classList.contains('collapsed');setPanelCollapsed(card,next);saved[id]=next;localStorage.setItem(PANEL_STORAGE_KEY,JSON.stringify(saved))}})}
initCollapsibleCards();
const menuPronounceBtn=document.getElementById('menuPronounceBtn');
let state=loadState(),selectedText='';
let readerFrame=null,readerFrameDoc=null,originalHtmlText='',originalHtmlUrl='';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanNote(s){return String(s||'').replace(/\\n/g,'\n')}
function storageKey(){return STORAGE_KEY+'::'+WORDBOOK_FILE}
function loadState(){try{const current=JSON.parse(localStorage.getItem(storageKey())||'null');return current&&current.words?current:{words:{},deletedWords:[]}}catch{return{words:{},deletedWords:[]}}}
function localSaveState(){localStorage.setItem(storageKey(),JSON.stringify(state));localStorage.setItem(STORAGE_KEY+'::lastDoc',JSON.stringify(currentDoc))}
async function persistWordbook(){localSaveState();try{await postJson(API+'/api/wordbook?file='+encodeURIComponent(WORDBOOK_FILE),{...state,displayName:currentDoc.displayName});await loadAllHighlightWords();renderWordList();updateDocStatus()}catch(e){console.warn('wordbook json save failed',e)}}
function saveState(){localSaveState();renderWordList();persistWordbook()}
async function loadAllHighlightWords(){highlightWords={...state.words};try{const res=await fetch(API+'/api/wordbooks');if(!res.ok)return;const store=await res.json();const files=store.files||{};Object.values(files).forEach(entry=>{const deleted=new Set(entry.deletedWords||[]);Object.entries(entry.words||{}).forEach(([word,data])=>{if(!deleted.has(word))highlightWords[word]=data})})}catch(e){console.warn('wordbook aggregate load failed',e)}}
async function loadWordbookFile(){try{const res=await fetch(API+'/api/wordbook?file='+encodeURIComponent(WORDBOOK_FILE));if(res.ok){const remote=await res.json();if(remote&&remote.words){const deleted=new Set([...(state.deletedWords||[]),...(Array.isArray(remote.deletedWords)?remote.deletedWords:[])]);state={words:{...state.words,...remote.words},deletedWords:[...deleted]};state.deletedWords.forEach(w=>delete state.words[w]);localSaveState()}}await loadAllHighlightWords();renderReader();renderWordList();updateSectionNav()}catch(e){console.warn('wordbook json load failed',e)}}
function updateDocStatus(){const wordCount=Object.keys(state.words||{}).length;const mode=originalHtmlText?'原样显示':'内置文本';const total=Object.keys(highlightWords||{}).length;docStatus.textContent=currentDoc.displayName+' · '+mode+' · 本文件生词 '+wordCount+' · 高亮 '+total}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2400)}
function renderReader(){if(originalHtmlText||originalHtmlUrl){renderOriginalDocument();return}reader.classList.remove('original-mode');reader.innerHTML='<div class="reader-placeholder"><div><b>选择本地 HTML 开始伴读</b><span>左上角打开文件。打开后会保持原页面结构，只叠加高亮、查词和拆句。</span></div></div>';updateSectionNav()}
function renderOriginalDocument(){reader.classList.add('original-mode');reader.innerHTML='<iframe class="reader-frame" id="readerFrame"></iframe>';readerFrame=document.getElementById('readerFrame');readerFrame.onload=()=>{try{readerFrameDoc=readerFrame.contentDocument}catch{readerFrameDoc=null}bindFrameDocument();applyFrameHighlightsToLoadedDoc();updateSectionNav()};if(originalHtmlUrl)readerFrame.src=originalHtmlUrl;else readerFrame.srcdoc=originalHtmlText}
function stripHtmlText(root){return String(root?.textContent||'').replace(/\s+/g,' ').trim()}
async function docIdForFile(file,text){const head=text.slice(0,200000);const data=new TextEncoder().encode([file.name,file.size,file.lastModified,head].join('::'));const hash=await crypto.subtle.digest('SHA-1',data);const hex=[...new Uint8Array(hash)].slice(0,8).map(b=>b.toString(16).padStart(2,'0')).join('');return file.name.replace(/[^a-zA-Z0-9._-]/g,'_')+'__'+hex}
function parseHtmlDocument(text,fileName){const doc=new DOMParser().parseFromString(text,'text/html');let sections=[];let paras=[];const sectionEls=[...doc.querySelectorAll('.section')];if(sectionEls.length){sectionEls.forEach((sec,idx)=>{const no=Number((sec.id||'').replace(/\D+/g,''))||idx+1;const title=stripHtmlText(sec.querySelector('.stitle .zh'))||stripHtmlText(sec.querySelector('h2,h3'))||'分段 '+no;const enTitle=stripHtmlText(sec.querySelector('.stitle .en'));const firstPara=paras.length;const enParas=[...sec.querySelectorAll('p.p-en')];enParas.forEach((p,i)=>{const cn=p.nextElementSibling&&p.nextElementSibling.matches('p.p-cn')?stripHtmlText(p.nextElementSibling):'';paras.push({en:stripHtmlText(p),cn,sectionId:'s'+no,sectionNo:no,sectionTitle:title,sectionEn:enTitle,localIndex:i+1})});sections.push({id:'s'+no,no,title,enTitle,firstPara,count:paras.length-firstPara})})}else{const blocks=[...doc.body.querySelectorAll('h1,h2,h3,p')].map(el=>({tag:el.tagName.toLowerCase(),text:stripHtmlText(el)})).filter(x=>x.text);let current=null;blocks.forEach(block=>{if(/^h[1-3]$/.test(block.tag)||!current){const no=sections.length+1;current={id:'s'+no,no,title:/^h[1-3]$/.test(block.tag)?block.text:'第 '+no+' 节',enTitle:'',firstPara:paras.length,count:0};sections.push(current);if(/^h[1-3]$/.test(block.tag))return}if(block.tag==='p'&&block.text.length>10){paras.push({en:block.text,cn:'',sectionId:current.id,sectionNo:current.no,sectionTitle:current.title,sectionEn:'',localIndex:current.count+1});current.count++}});sections=sections.filter(s=>s.count>0);if(!sections.length&&paras.length){sections=[{id:'s1',no:1,title:fileName,enTitle:'',firstPara:0,count:paras.length}]}}sections.forEach((s,i)=>{s.no=i+1;s.id='s'+(i+1);s.firstPara=paras.findIndex(p=>p.sectionId===s.id||p.sectionNo===s.no);if(s.firstPara<0)s.firstPara=0});paras.forEach((p,i)=>{const sec=sections.find(s=>i>=s.firstPara&&i<s.firstPara+s.count)||sections[sections.length-1];p.sectionId=sec?sec.id:'s1';p.sectionNo=sec?sec.no:1});if(!paras.length){sections=[];paras=[]}return{sections,paras}}
async function loadDocumentFromFile(file){const text=await file.text();currentDoc={id:await docIdForFile(file,text),displayName:file.name,source:'file',size:file.size,lastModified:file.lastModified};WORDBOOK_FILE=currentDoc.id;originalHtmlText=text;originalHtmlUrl='';PARAS=[];SECTIONS=[];state=loadState();selectedText='';selectionBox.textContent='还没有选择文本。';meaningInput.value='';noteInput.value='';sentenceBox.innerHTML='选中一句英文后点“AI 拆解句子”。';renderSectionNav();renderReader();renderWordList();updateDocStatus();await loadWordbookFile();updateDocStatus();persistWordbook();toast('已打开：'+file.name)}
function safePathId(path){return String(path||'').replace(/[^a-zA-Z0-9._-]/g,'_')}
function pathToFileUrl(path){let s=String(path||'').trim().replace(/^['"]|['"]$/g,'');if(!s)return'';s=s.replace(/\\/g,'/');if(/^[a-zA-Z]:\//.test(s))s='/'+s;return 'file://'+encodeURI(s)}
function displayNameFromPath(path){return String(path||'').replace(/\\/g,'/').split('/').pop()||'本地 HTML'}
async function loadDocumentFromPath(path){const url=pathToFileUrl(path);if(!url)throw new Error('请输入本地 HTML 路径');currentDoc={id:safePathId(path),displayName:displayNameFromPath(path),source:'path',path};WORDBOOK_FILE=currentDoc.id;originalHtmlText='';originalHtmlUrl=url;PARAS=[];SECTIONS=[];state=loadState();selectedText='';selectionBox.textContent='还没有选择文本。';meaningInput.value='';noteInput.value='';sentenceBox.innerHTML='选中一句英文后点“AI 拆解句子”。';renderSectionNav();renderReader();renderWordList();updateDocStatus();await loadWordbookFile();updateDocStatus();persistWordbook();toast('已打开：'+currentDoc.displayName)}
openPathBtn.onclick=async()=>{try{await loadDocumentFromPath(pathInput.value)}catch(e){toast('打开失败：'+e.message)}};
fileInput.addEventListener('change',async()=>{const file=fileInput.files&&fileInput.files[0];if(!file)return;try{await loadDocumentFromFile(file)}catch(e){toast('打开失败：'+e.message)}});
reloadCurrentBtn.onclick=()=>fileInput.click();
function bindFrameDocument(){if(!readerFrameDoc)return;const style=readerFrameDoc.createElement('style');style.textContent='.hl-word{background:rgba(255,205,73,.72);border-radius:4px;padding:0 2px;cursor:pointer;box-shadow:inset 0 -1px 0 rgba(166,111,33,.35)}.hl-word.mastered{background:rgba(151,181,156,.3);border-bottom:1px dotted #5f8b63}';readerFrameDoc.head.appendChild(style);bindDocInteractions(readerFrameDoc);readerFrame.contentWindow.addEventListener('scroll',()=>{closeTips();closeActionMenu();updateSectionNav()})}
function renderSectionNav(){if(!sectionNav)return;if(originalHtmlText||!SECTIONS.length){sectionNav.innerHTML='';sectionNav.classList.add('empty');layout.classList.add('no-nav');return}layout.classList.remove('no-nav');sectionNav.classList.remove('empty');sectionNav.innerHTML='<div class="nav-title">挪威的森林<span class="nav-progress" id="navProgress">第一章 · '+SECTIONS.length+'段</span></div><div class="nav-list">'+SECTIONS.map(s=>'<button class="nav-link" type="button" data-section="'+s.id+'"><span class="num">'+s.no+'</span><span class="name">'+esc(s.title.replace(/ · .*/,''))+'</span><span class="meta">'+esc(s.enTitle)+' · '+s.count+' 段</span></button>').join('')+'</div><div class="nav-footer">村上春树</div>';sectionNav.querySelectorAll('.nav-link').forEach(btn=>btn.onclick=()=>{const target=document.getElementById(btn.dataset.section);if(target)target.scrollIntoView({behavior:'smooth',block:'start'})})}
function updateSectionNav(){if(originalHtmlText){if(sectionNav)sectionNav.classList.add('empty');if(layout)layout.classList.add('no-nav');return}if(!sectionNav||!SECTIONS.length)return;if(!sectionNav.querySelector('.nav-link'))renderSectionNav();let current=SECTIONS[0];if(readerFrameDoc){const frameTop=readerFrame.getBoundingClientRect().top;readerFrameDoc.querySelectorAll('.section').forEach(marker=>{const top=frameTop+marker.getBoundingClientRect().top;if(top-reader.getBoundingClientRect().top<=32){const found=SECTIONS.find(s=>s.id===marker.id);if(found)current=found}})}else{const readerTop=reader.getBoundingClientRect().top+18;document.querySelectorAll('.section-marker').forEach(marker=>{if(marker.getBoundingClientRect().top-readerTop<=8){const found=SECTIONS.find(s=>s.id===marker.id);if(found)current=found}})}sectionNav.querySelectorAll('.nav-link').forEach(btn=>{const sec=SECTIONS.find(s=>s.id===btn.dataset.section);btn.classList.toggle('active',sec&&sec.id===current.id);btn.classList.toggle('past',sec&&sec.no<current.no)});const progress=document.getElementById('navProgress');if(progress)progress.textContent='第 '+current.no+' / '+SECTIONS.length+' 段 · '+current.title.replace(/ · .*/,'')}
function wordPos(w){return String((w&&w.partOfSpeech)||(w&&w.ai&&w.ai.partOfSpeech)||(w&&w.meaning)||'').toLowerCase()}
function isNounWord(w){const pos=wordPos(w);return /(^|\b)(noun|n\.|名词)(\b|$)/.test(pos)}
function isVerbWord(w){const pos=wordPos(w);return /(^|\b)(verb|v\.|动词)(\b|$)/.test(pos)}
function pluralFor(base){if(!base||base.length<2)return'';if(/[^a-z]/i.test(base))return'';if(/[^aeiou]y$/i.test(base))return base.slice(0,-1)+'ies';if(/(?:s|x|z|ch|sh)$/i.test(base))return base+'es';return base+'s'}
function cleanFormList(forms,base,w){const set=new Set([base]);const noun=isNounWord(w),verb=isVerbWord(w);(forms||[]).forEach(x=>{const f=String(x||'').toLowerCase().trim();if(!f||f.length<2)return;if(f===base)return;const looksVerbish=f===base+'ed'||f===base+'ing'||f===base.slice(0,-1)+'ing'||f===base.slice(0,-1)+'ed'||f===base.slice(0,-1)+'ied';if(!verb&&looksVerbish)return;if(!noun&&!verb&&(f===base+'s'||f===base+'es'||f===base.slice(0,-1)+'ies'))return;set.add(f)});if(verb&&irregular[base])irregular[base].forEach(x=>set.add(x));if(noun){const p=pluralFor(base);if(p)set.add(p)}return[...set].filter(x=>x.length>1)}
function formsFor(input){const w=typeof input==='string'?((highlightWords&&highlightWords[input])||(state.words&&state.words[input])||{base:input}):(input||{});const base=String(w.base||input||'').toLowerCase().trim();const forms=[];if(Array.isArray(w.forms))forms.push(...w.forms);if(w.ai&&Array.isArray(w.ai.forms))forms.push(...w.ai.forms);return cleanFormList(forms,base,w)}
function rxEsc(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function highlight(text){const entries=Object.values(state.words).filter(w=>w&&w.base);if(!entries.length)return text;const map=new Map();entries.forEach(w=>formsFor(w).forEach(f=>map.set(String(f).toLowerCase(),w.base)));const pattern=[...map.keys()].filter(x=>/^[a-zA-Z']+$/.test(x)).sort((a,b)=>b.length-a.length).map(rxEsc).join('|');if(!pattern)return text;return text.replace(new RegExp('\\b('+pattern+')\\b','gi'),m=>{const b=map.get(m.toLowerCase());const item=state.words[b]||{};return '<span class="hl-word '+(item.mastered?'mastered':'')+'" data-base="'+esc(b)+'">'+m+'</span>'})}
function wordFormMap(){const entries=Object.values(highlightWords&&Object.keys(highlightWords).length?highlightWords:state.words).filter(w=>w&&w.base);const map=new Map();entries.forEach(w=>formsFor(w).forEach(f=>map.set(String(f).toLowerCase(),w.base)));return map}
let frameRenderToken=0;
function scheduleFrameRender(){if(!originalHtmlText||!readerFrame)return;const token=++frameRenderToken;readerFrame.onload=()=>{if(token!==frameRenderToken)return;readerFrameDoc=readerFrame.contentDocument;bindFrameDocument();applyFrameHighlightsToLoadedDoc();updateSectionNav()};readerFrame.srcdoc=originalHtmlText}
function applyFrameHighlights(){if(!readerFrameDoc)return;if(originalHtmlText){scheduleFrameRender();return}applyFrameHighlightsToLoadedDoc()}
function applyFrameHighlightsToLoadedDoc(){if(!readerFrameDoc)return;const map=wordFormMap();if(!map.size)return;const words=[...map.keys()].filter(x=>/^[a-zA-Z']+$/.test(x)).sort((a,b)=>b.length-a.length);if(!words.length)return;const re=new RegExp('\\b('+words.map(rxEsc).join('|')+')\\b','gi');for(const doc of collectAccessibleDocs()){applyHighlightsInDoc(doc,re,map)}}
function applyHighlightsInDoc(doc,re,map){if(!doc||!doc.body||doc.body.dataset.highlightApplied==='1')return;const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT,{acceptNode(node){const parent=node.parentElement;if(!parent||['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(parent.tagName)||parent.closest('.hl-word'))return NodeFilter.FILTER_REJECT;return /[A-Za-z]/.test(node.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP}});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){const text=node.nodeValue;re.lastIndex=0;if(!re.test(text))continue;re.lastIndex=0;const frag=doc.createDocumentFragment();let last=0;let match;while((match=re.exec(text))){const hit=match[0];const index=match.index;if(index>last)frag.appendChild(doc.createTextNode(text.slice(last,index)));const base=map.get(hit.toLowerCase());const span=doc.createElement('span');span.className='hl-word '+((state.words[base]&&state.words[base].mastered)?'mastered':'');span.dataset.base=base;span.textContent=hit;span.addEventListener('click',showTip);frag.appendChild(span);last=index+hit.length}if(last<text.length)frag.appendChild(doc.createTextNode(text.slice(last)));node.parentNode.replaceChild(frag,node)}doc.body.dataset.highlightApplied='1'}
function normalizeWord(t){const m=String(t||'').trim().match(/^[A-Za-z]+(?:['’-][A-Za-z]+)?$/);return m?m[0].toLowerCase().replace(/[’']/g,"'"):''}
function collectAccessibleDocs(rootDoc=readerFrameDoc,docs=[]){if(!rootDoc)return docs;docs.push(rootDoc);rootDoc.querySelectorAll('iframe,frame').forEach(f=>{try{if(f.contentDocument)collectAccessibleDocs(f.contentDocument,docs)}catch{}});return docs}
function bindDocInteractions(doc){if(!doc||doc.body.dataset.readerBound==='1')return;doc.body.dataset.readerBound='1';doc.addEventListener('selectionchange',captureSelection);doc.addEventListener('click',e=>{if(!e.target.closest('.hl-word'))closeTips();closeActionMenu()});doc.addEventListener('contextmenu',e=>{const text=readReaderSelection();if(!text)return;e.preventDefault();selectedText=text;selectionBox.textContent=selectedText;const pt=framePointToTop(doc,e.clientX,e.clientY);openActionMenu(pt.x,pt.y)});doc.querySelectorAll('iframe,frame').forEach(f=>{f.onload=()=>{try{bindDocInteractions(f.contentDocument);applyFrameHighlightsToLoadedDoc()}catch{}};try{if(f.contentDocument)bindDocInteractions(f.contentDocument)}catch{}})}
function framePointToTop(doc,x,y){let win=doc.defaultView;let px=x,py=y;while(win&&win.frameElement){const r=win.frameElement.getBoundingClientRect();px+=r.left;py+=r.top;win=win.parent}return{x:px,y:py}}
function elementRectToTop(el){const r=el.getBoundingClientRect();const pt=framePointToTop(el.ownerDocument,r.left,r.bottom);return{left:pt.x,top:pt.y}}
function frameSelection(){for(const doc of collectAccessibleDocs()){try{const sel=doc.defaultView.getSelection();if(sel&&String(sel).trim()&&sel.rangeCount)return sel}catch{}}return null}
function selectionRootElement(sel){if(!sel||!sel.rangeCount)return null;const node=sel.getRangeAt(0).commonAncestorContainer;return node.nodeType===1?node:node.parentElement}
function readReaderSelection(){const sel=frameSelection()||window.getSelection();const t=sel?String(sel).trim():'';if(!t||!sel.rangeCount)return'';const el=selectionRootElement(sel);if(readerFrameDoc)return el&&readerFrameDoc.body.contains(el)?t.replace(/\s+/g,' ').trim():'';return el&&reader.contains(el)?t.replace(/\s+/g,' ').trim():''}
function captureSelection(){const t=readReaderSelection();if(!t)return;selectedText=t;selectionBox.textContent=selectedText;const w=normalizeWord(selectedText);selectionHelp.textContent=w?'已选中单词：'+w+'。可以点 AI 查词自动保存。':'已选中一句/一段文字，可以拆解句子。';if(w&&state.words[w]){meaningInput.value=state.words[w].meaning||'';noteInput.value=cleanNote(state.words[w].note||'')}}
document.addEventListener('selectionchange',captureSelection);
async function postJson(url,body){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'请求失败');return data}
function currentContext(){const sel=frameSelection()||window.getSelection();if(sel&&sel.rangeCount){const el=selectionRootElement(sel);const scope=readerFrameDoc?readerFrameDoc.body:reader;const block=el&&scope.contains(el)?el.closest('p,.p-en,.en,article,section,div'):null;if(block)return block.innerText||block.textContent||selectedText}return selectedText}
async function runAiWordLookup(){const base=normalizeWord(selectedText);if(!base){toast('先在左侧拖选一个英文单词');return}aiWordBtn.disabled=true;aiWordBtn.textContent='AI 查词中...';try{const data=await postJson(API+'/api/word',{word:base,context:currentContext()});const key=data.base||base;state.words[key]={base:key,meaning:[data.partOfSpeech,data.meaningZh].filter(Boolean).join(' '),note:[data.memoryHintZh||'',data.exampleEn||'',data.exampleZh||''].filter(Boolean).join('\n'),forms:Array.isArray(data.forms)?data.forms:[],mastered:false,createdAt:Date.now(),ai:data};selectedText=key;selectionBox.textContent=key;meaningInput.value=state.words[key].meaning;noteInput.value=cleanNote(state.words[key].note);saveState();highlightWords[key]=state.words[key];refreshHighlightsInPlace();toast('已查词并保存')}catch(e){toast('AI 查词失败：'+e.message)}finally{aiWordBtn.disabled=false;aiWordBtn.textContent='AI 查词'}}
aiWordBtn.onclick=runAiWordLookup;
function refreshHighlightsInPlace(){if(readerFrameDoc){clearFrameHighlightApplied();applyFrameHighlightsToLoadedDoc()}else renderReader()}
function clearFrameHighlightApplied(){for(const doc of collectAccessibleDocs()){if(doc&&doc.body)delete doc.body.dataset.highlightApplied}}
function removeWordHighlightsInPlace(word){for(const doc of collectAccessibleDocs()){doc.querySelectorAll('span.hl-word').forEach(span=>{if(span.dataset.base===word)span.replaceWith(doc.createTextNode(span.textContent||''))});if(doc.body)delete doc.body.dataset.highlightApplied;doc.body&&doc.body.normalize()}}
function deleteWordFromCurrentFile(word){if(!state.words[word]){toast('这是其他 HTML 的高亮词，不在当前文件单词本里');return}delete state.words[word];state.deletedWords=[...(state.deletedWords||[]).filter(x=>x!==word),word];delete highlightWords[word];removeWordHighlightsInPlace(word);if(selectedText===word){selectedText='';selectionBox.textContent='还没有选择文本。';meaningInput.value='';noteInput.value=''}closeTips();saveState();toast('已删除：'+word)}
function renderWordList(){updateDocStatus();const words=Object.values(state.words).sort((a,b)=>a.base.localeCompare(b.base));wordList.innerHTML=words.length?words.map(w=>'<div class="word-item '+(w.mastered?'mastered':'')+'" data-word="'+esc(w.base)+'"><div class="word-head"><strong>'+esc(w.base)+'</strong><button class="word-delete" type="button" title="删除" aria-label="删除 '+esc(w.base)+'">删除</button></div><span>'+esc(w.meaning||'待补充中文')+'</span><span>'+formsFor(w).slice(0,8).map(esc).join(' / ')+'</span></div>').join(''):'<p class="small">还没有单词。</p>';wordList.querySelectorAll('.word-item').forEach(el=>{el.onclick=e=>{if(e.target.closest('.word-delete'))return;const w=state.words[el.dataset.word];selectedText=w.base;selectionBox.textContent=w.base;meaningInput.value=w.meaning||'';noteInput.value=cleanNote(w.note||'')};el.ondblclick=e=>{if(e.target.closest('.word-delete'))return;state.words[el.dataset.word].mastered=!state.words[el.dataset.word].mastered;saveState()}});wordList.querySelectorAll('.word-delete').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const item=btn.closest('.word-item');const word=item&&item.dataset.word;if(!word)return;deleteWordFromCurrentFile(word)}})}
function closeTips(){document.querySelectorAll('.tip').forEach(x=>x.remove())}
function showTip(e){e.stopPropagation();const b=e.currentTarget.dataset.base,w=(state.words&&state.words[b])||(highlightWords&&highlightWords[b])||{base:b};closeTips();const tip=document.createElement('div');tip.className='tip';tip.innerHTML='<button class="tip-close" type="button" aria-label="关闭">×</button><b>'+esc(b)+'</b><button class="tip-speak" type="button">发音</button><button class="tip-delete" type="button">删除</button><br>'+esc(w.meaning||'待补充中文')+'<br><small>'+esc(cleanNote(w.note||''))+'</small>';document.body.appendChild(tip);tip.querySelector('.tip-close').onclick=closeTips;tip.querySelector('.tip-speak').onclick=()=>speakWord(b);tip.querySelector('.tip-delete').onclick=()=>deleteWordFromCurrentFile(b);const pos=readerFrame&&e.currentTarget.ownerDocument!==document?elementRectToTop(e.currentTarget):(()=>{const r=e.currentTarget.getBoundingClientRect();return{left:r.left,top:r.bottom}})();tip.style.left=Math.min(Math.max(8,pos.left),innerWidth-328)+'px';tip.style.top=Math.max(8,pos.top+8)+'px'}
document.addEventListener('click',e=>{if(!e.target.closest('.tip')&&!e.target.closest('.hl-word'))closeTips()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTips()});
reader.addEventListener('scroll',closeTips);
async function runAiSentenceParse(){captureSelection();const sentence=(readReaderSelection()||selectedText||'').replace(/\s+/g,' ').trim();if(!sentence||sentence.split(/\s+/).length<5){toast('先选中一句英文长句');return}selectedText=sentence;selectionBox.textContent=sentence;parseBtn.disabled=true;parseBtn.textContent='AI 拆解中...';try{const data=await postJson(API+'/api/sentence',{sentence});const arr=x=>Array.isArray(x)?x:[];sentenceBox.innerHTML='<div class="parse-block"><b>原句</b><br>'+esc(data.original||sentence)+'</div><div class="parse-block"><b>主干</b><br>'+esc(data.mainClause||'')+'<br>主语：'+esc(data.subject||'')+'<br>谓语：'+esc(data.predicate||'')+'</div><div class="parse-block"><b>宾语 / 补足语</b><br>'+arr(data.objectsOrComplements).map(esc).join('<br>')+'</div><div class="parse-block"><b>修饰成分</b><br>'+arr(data.modifiers).map(esc).join('<br>')+'</div><div class="parse-block"><b>从句</b><br>'+(arr(data.clauses).length?arr(data.clauses).map(esc).join('<br>'):'无明显从句')+'</div><div class="parse-block"><b>重点词组</b><br>'+arr(data.phrases).map(esc).join('<br>')+'</div><div class="parse-block"><b>简单英文</b><br>'+esc(data.simpleEnglish||'')+'</div><div class="parse-block"><b>中文意思</b><br>'+esc(data.translationZh||'')+'</div><div class="parse-block"><b>学习点</b><br>'+esc(data.learningPointZh||'')+'</div>'}catch(e){toast('AI 拆句失败：'+e.message)}finally{parseBtn.disabled=false;parseBtn.textContent='AI 拆解句子'}}
parseBtn.onclick=runAiSentenceParse;
function selectedPronounceWord(){const exact=normalizeWord(selectedText);if(exact)return exact;const m=String(selectedText||'').match(/[A-Za-z]+(?:['’-][A-Za-z]+)?/);return m?normalizeWord(m[0]):''}
function speakWord(word){const w=word||selectedPronounceWord();if(!w){toast('先选中一个英文单词');return}if(!('speechSynthesis' in window)){toast('当前浏览器不支持发音');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.86;u.pitch=1;speechSynthesis.speak(u);toast('发音：'+w)}
function closeActionMenu(){actionMenu.classList.remove('show')}
function openActionMenu(x,y){captureSelection();if(!selectedText){toast('先选中英文单词或句子');return}actionMenu.style.left=Math.min(x,innerWidth-140)+'px';actionMenu.style.top=Math.min(y,innerHeight-92)+'px';actionMenu.classList.add('show')}
reader.addEventListener('contextmenu',e=>{const text=readReaderSelection();if(!text)return;e.preventDefault();selectedText=text;selectionBox.textContent=selectedText;openActionMenu(e.clientX,e.clientY)});
menuWordBtn.onclick=()=>{closeActionMenu();runAiWordLookup()};
menuSentenceBtn.onclick=()=>{closeActionMenu();runAiSentenceParse()};
menuPronounceBtn.onclick=()=>{closeActionMenu();speakWord()};
document.addEventListener('click',e=>{if(!e.target.closest('.action-menu'))closeActionMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeActionMenu()});
reader.addEventListener('scroll',closeActionMenu);
reader.addEventListener('scroll',updateSectionNav);
try{const last=JSON.parse(localStorage.getItem(STORAGE_KEY+'::lastDoc')||'null');if(last&&last.id){currentDoc=last;docStatus.textContent='最近打开：'+last.displayName+'。请重新选择该 HTML 文件。'}}catch{}renderSectionNav();renderReader();renderWordList();updateSectionNav();updateDocStatus();
</script>
