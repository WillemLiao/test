<div class="container">
<div class="hero"><div class="ch">CHAPTER 44</div><h1>选择做自己</h1><div class="sub">纳瓦尔宝典 · The Almanack of Naval Ravikant</div></div>
<div class="body">
  <div class="highlight">你唯一应该做的事，是你自己想做的事。</div>
  <div class="qbox"><div class="big">在"做自己"这件事情上，没有人能与你竞争。</div></div>
  <div class="sec-title">🎯 倾听内心的声音</div>
  <div class="card"><div class="card-body">如果不再费心去揣摩别人的期待，你就能听到自己脑海中那个微弱的声音——那个声音代表了你真实的想法。倾听它，你就可以做自己了。</div></div>
  <div class="card"><div class="card-body">你的目标是找到最需要你的人、事业、项目或艺术。总有一些人和事会与你完美契合。不要基于别人正在做的事为你自己列清单、做决策。</div></div>
  <div class="qbox"><div class="big">要做出原创性贡献，<br>必须非理性地痴迷。</div></div>
</div>
<div class="footer">— 纳瓦尔宝典 · 第 44 章 —</div>
