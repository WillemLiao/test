<script>
const PARAS=[{"en":"I WAS THIRTY-SEVEN THEN, STRAPPED IN MY SEAT AS THE HUGE 747 plunged through dense cloud cover on approach to the Hamburg airport. Cold November rains drenched the earth and lent everything the gloomy air of a Flemish landscape: the ground crew in rain gear, a flag atop a squat airport building, a BMW billboard. So—Germany again.","cn":"我三十七岁，正坐在波音747的座位上。巨大的机体穿过厚重的雨云，向汉堡机场降落。十一月的冷雨将大地染成一片昏暗，使得一切都带上了佛兰德画派那种阴郁的气息：地勤人员身上的雨衣、机场前面矮楼顶上的旗帜、BMW的广告牌。什么，又是德国。","sectionId":"s1","sectionNo":1,"sectionTitle":"汉堡机场 · Norwegian Wood","sectionEn":"Opening · 1987, a 747, the song that shatters","localIndex":1},{"en":"Once the plane was on the ground, soft music began to flow from the ceiling speakers: a sweet orchestral cover version of the Beatles' \"Norwegian Wood.\" The melody never failed to send a shudder through me, but this time it hit me harder than ever.","cn":"飞机一着地，天花板上的扬声器便开始轻柔地流淌出音乐——管弦乐队演奏的披头士《挪威的森林》的甜美改编版。那旋律每次都让我浑身发颤，但这一次它比以往任何时候都更剧烈地击打我。","sectionId":"s1","sectionNo":1,"sectionTitle":"汉堡机场 · Norwegian Wood","sectionEn":"Opening · 1987, a 747, the song that shatters","localIndex":2},{"en":"I bent forward in my seat, face in hands to keep my skull from splitting open. Before long a stewardess approached and asked if I were sick. \"No,\" I said, \"just dizzy.\"","cn":"我在座位上弯下腰，双手捂住脸，以免头骨裂开。不久一位空乘走近，用英语问我是不是不舒服。\"没有，\"我说，\"只是有点晕。\"","sectionId":"s1","sectionNo":1,"sectionTitle":"汉堡机场 · Norwegian Wood","sectionEn":"Opening · 1987, a 747, the song that shatters","localIndex":3},{"en":"I looked out the plane window at the dark clouds hanging over the North Sea, thinking of what I had lost in the course of my life: times gone forever, friends who had died or disappeared, feelings I would never know again.","cn":"我望着窗外悬浮在北海上空的乌云，想着自己在人生历程中失去了什么：一去不返的时间、死去或消失的朋友、永远不会再有的感受。","sectionId":"s1","sectionNo":1,"sectionTitle":"汉堡机场 · Norwegian Wood","sectionEn":"Opening · 1987, a 747, the song that shatters","localIndex":4},{"en":"\"I'm fine, thanks. Just feeling kind of blue.\" — \"I know what you mean. It happens to me, too, every once in a while.\"","cn":"\"我没事，谢谢。只是有点忧郁。\"——\"我懂你的感受。我偶尔也会这样。\"","sectionId":"s1","sectionNo":1,"sectionTitle":"汉堡机场 · Norwegian Wood","sectionEn":"Opening · 1987, a 747, the song that shatters","localIndex":5},{"en":"EIGHTEEN YEARS HAVE GONE BY, and still I can bring back every detail of that day in the meadow. Washed clean of summer's dust by days of gentle rain, the mountains wore a deep, brilliant green. The October breeze set white fronds of head-tall grasses swaying. One long streak of cloud hung pasted across a dome of frozen blue. It almost hurt to look at that far-off sky.","cn":"十八年了。直到今天，我仍能清晰地记起那片草地上那一天的每一个细节。连日的细雨洗去了夏日的尘埃，群山呈现出深邃而鲜亮的绿色。十月的风拂过高高的草丛，白色的穗浪摇曳起伏。一道长长的云像涂抹过一般悬在冰蓝色的穹顶。凝望那远天的云，几乎让人感到疼痛。","sectionId":"s2","sectionNo":2,"sectionTitle":"十八年前的草地","sectionEn":"The Meadow · Autumn 1969, about to turn twenty","localIndex":1},{"en":"A puff of wind swept across the meadow and through her hair before it slipped into the woods to rustle branches and send back snatches of distant barking—a hazy sound that seemed to reach us from the doorway to another world. We heard no other sounds. We saw only two bright, red birds leap startled from the center of the meadow and dart into the woods. As we ambled along, Naoko spoke to me of wells.","cn":"一阵风掠过草地，吹动她的头发，然后潜入林中，摇动树枝，带回远处隐约的狗吠声——那模糊的声音像是从另一个世界的门口传来的。没有其他声响。我们只看见两只鲜红色的鸟从草地中央惊飞而起，箭一般射入林中。我们慢慢走着，直子对我说起了井。","sectionId":"s2","sectionNo":2,"sectionTitle":"十八年前的草地","sectionEn":"The Meadow · Autumn 1969, about to turn twenty","localIndex":2},{"en":"Memory is a funny thing. When I was in the scene, I hardly paid it any mind. I never stopped to think of it as something that would make a lasting impression, certainly never imagined that eighteen years later I would recall it in such detail. I didn't give a damn about the scenery that day. I was thinking about myself. It was the age, that time of life when every sight, every feeling, every thought came back, like a boomerang, to me. And worse, I was in love. Love with complications.","cn":"记忆这东西真是不可思议。置身其中时我几乎没把它当回事，从未想过它会留下如此深刻的印象，更没料到十八年后会如此清晰地回忆起每一个细节。那天我根本没在意什么风景。我满脑子想的都是自己——想着身边这个美丽的女孩，想着我们两人在一起，然后又回到自己身上。那是那个年纪的特点：人生中那个阶段，每一个景象、每一种感受、每一个念头都像回旋镖一样飞回我身上。更糟的是，我在恋爱。复杂的恋爱。风景是我最不关心的东西。","sectionId":"s3","sectionNo":3,"sectionTitle":"记忆的悖论","sectionEn":"Memory · \"no one is in it\"","localIndex":1},{"en":"Now, though, that meadow scene is the first thing that comes back to me. The smell of the grass, the faint chill of the wind, the line of the hills, the barking of a dog: these come with absolute clarity. And yet, as clear as the scene may be, no one is in it. No one. Naoko is not there, and neither am I.","cn":"可现在，首先浮现在我脑海里的，就是那片草地风景。青草的香气、微风的凉意、山峦的轮廓、狗吠声——这些首先浮现，而且无比清晰。然而，无论那景象多么清晰，里面却空无一人。没有直子，也没有我。","sectionId":"s3","sectionNo":3,"sectionTitle":"记忆的悖论","sectionEn":"Memory · \"no one is in it\"","localIndex":2},{"en":"Where could we have disappeared to? How could such a thing have happened? Everything that seemed so important back then—Naoko, and the self I was then, and the world I had then: where could they have all gone?","cn":"我们究竟消失到什么地方去了呢？为什么会发生这样的事情呢？曾经那么重要的一切——直子、当年的我、当年的世界——它们都到哪儿去了呢？","sectionId":"s3","sectionNo":3,"sectionTitle":"记忆的悖论","sectionEn":"Memory · \"no one is in it\"","localIndex":3},{"en":"True, given time enough, I can bring back her face. I start joining images—her tiny, cold hand; her straight, black hair so smooth and cool to the touch; a soft, rounded earlobe and the microscopic mole just beneath it; the camel's hair coat she wore in the winter; her habit of looking straight into your eyes when asking a question; the slight trembling that would come to her voice now and then—and suddenly her face is there, always in profile at first, because Naoko and I were always out walking together, side by side.","cn":"说得没错，只要给我足够的时间，我还是能想起她的脸。我先将一个个零碎的印象拼接起来——她那双冰冷的小手、那头笔直而柔滑的黑发、柔软圆润的耳垂和耳垂下方一粒小小的痣、冬天里她穿的那件骆驼毛外套、她问问题时直视你眼睛的习惯、她说话声音时不时出现的轻微颤抖（仿佛她正站在一座风很大的山丘上说话）——然后她的脸便突然出现了。一开始总是侧脸，因为直子和我在外走路时总是并排走。","sectionId":"s4","sectionNo":4,"sectionTitle":"Naoko的面容","sectionEn":"Her Face · shadows lengthening at dusk","localIndex":1},{"en":"I do need that time, though, for Naoko's face to appear. And as the years have passed, the time has grown longer. The sad truth is that what I could recall in five seconds all too soon needed ten, then thirty, then a full minute—like shadows lengthening at dusk. Someday, I suppose, the shadows will be swallowed up in darkness.","cn":"但我需要时间才能让直子的脸浮现，而且随着岁月流逝，需要的时间越来越长。悲哀的事实是：原本五秒钟就能想起来的事物，很快变成了十秒、三十秒、整整一分钟——像黄昏时渐渐拉长的影子。总有一天，我想，这些影子会完全被黑暗吞没。","sectionId":"s4","sectionNo":4,"sectionTitle":"Naoko的面容","sectionEn":"Her Face · shadows lengthening at dusk","localIndex":2},{"en":"Each time it appears, it delivers a kick to some part of my mind. \"Wake up,\" it says. \"I'm still here. Wake up and think about it. Think about why I'm still here.\" The kicking never hurts me. There's no pain at all. Just a hollow sound that echoes with each kick. And even that is bound to fade one day.","cn":"每次它出现，都会在我脑海的某个角落踢上一脚。\"醒醒，\"它说，\"我还在。醒醒，想想吧。想想为什么我还在。\"这种踢打从不让我感到疼痛，一丝痛楚都没有。只是随着每一次踢打，传来空洞的回声。而就连那声音，也终有一天会消退。","sectionId":"s4","sectionNo":4,"sectionTitle":"Naoko的面容","sectionEn":"Her Face · shadows lengthening at dusk","localIndex":3},{"en":"At the Hamburg airport, though, the kicks were longer and harder than usual. Which is why I am writing this book. To think. To understand. I have to write things down to feel I fully comprehend them.","cn":"不过，在汉堡机场那一次，踢打比以往更持久、更猛烈。所以我才会写这本书。为了思考，为了理解。我就是这样的人——必须把东西写下来才能觉得自己完全理解了它们。","sectionId":"s4","sectionNo":4,"sectionTitle":"Naoko的面容","sectionEn":"Her Face · shadows lengthening at dusk","localIndex":4},{"en":"Of course: the \"field well.\" I have no idea whether such a well ever existed. It might have been an image or a sign that existed only inside Naoko, like all the other things she used to spin into existence inside her mind in those dark days.","cn":"对了：就是\"田野里的井\"。我不知道那口井是否真的存在。那或许只是存在于直子心中的一个意象或符号——就像那段黑暗日子里她在自己脑海中编织出的其他一切一样。","sectionId":"s5","sectionNo":5,"sectionTitle":"田野之井","sectionEn":"The Field Well · a dark opening a yard across","localIndex":1},{"en":"I can go so far as to describe the well in minute detail. It lay precisely on the border where the meadow ended and the woods began—a dark opening in the earth a yard across, hidden by the meadow grass. Nothing marked its perimeter—no fence, no stone curb. It was nothing but a hole, a mouth open wide. The stones of its collar had been weathered and turned a strange muddy white. You could lean over the edge and peer down to see nothing. All I knew about the well was its frightening depth. It was deep beyond measuring, and crammed full of darkness, as if all the world's darknesses had been boiled down to their ultimate density.","cn":"但我甚至可以极其详尽地描述那口井。它正好位于草地与森林的分界线上——草丛中一个直径一码左右的黑色洞口。周围没有任何标志——既没有栅栏，也没有石沿。它只是一个洞，一张大张着的嘴。井口的石头已经风化，变成一种奇特的灰白色，裂缝中爬进一只绿色的小蜥蜴。俯身探看，什么都看不见。我唯一知道的是它的可怕深度。深不可测，而且塞满了黑暗——仿佛全世界的黑暗被浓缩到了终极的浓度。","sectionId":"s5","sectionNo":5,"sectionTitle":"田野之井","sectionEn":"The Field Well · a dark opening a yard across","localIndex":2},{"en":"\"It's really, really deep,\" said Naoko, choosing her words with care. \"But no one knows where it is.\"","cn":"\"真的很深很深，\"直子小心翼翼地选择着用词，\"可是没有人知道它在哪儿。\"","sectionId":"s5","sectionNo":5,"sectionTitle":"田野之井","sectionEn":"The Field Well · a dark opening a yard across","localIndex":3},{"en":"\"Then it must be incredibly dangerous. A deep well, but nobody knows where it is. You could fall in and that'd be the end of you.\"","cn":"\"那一定非常危险。一口深井，却没人知道它在哪里。掉下去就完了。\"","sectionId":"s6","sectionNo":6,"sectionTitle":"井边的对话","sectionEn":"\"Aaaaaaaah, splat. Finished.\"","localIndex":1},{"en":"\"The end. Aaaaaaaah, splat. Finished.\"","cn":"\"完了。啊——啪嗒！结束。\"","sectionId":"s6","sectionNo":6,"sectionTitle":"井边的对话","sectionEn":"\"Aaaaaaaah, splat. Finished.\"","localIndex":2},{"en":"\"No, it's a terrible way to die. The best thing would be to break your neck, but you'd probably just break your leg and then you couldn't do a thing. You'd yell at the top of your lungs, but nobody'd hear you, and you'd have centipedes and spiders crawling all over you, and the bones of the ones who died before are scattered all around you, and it's dark and soggy, and way overhead there's this tiny, tiny circle of light like a winter moon. You die there in this place, little by little, all by yourself.\"","cn":"\"是很可怕的死法。最好的情况是摔断脖子，但多半只是摔断腿，然后就什么也做不了了。你拼命大喊，但没人听得见，也没人会找到你。蜈蚣和蜘蛛在你身上爬来爬去，以前死在那里的人的骨头散落在你四周，又黑又潮湿，头顶上方有一个小小的、小小的光圈，像冬天的月亮。你在那里一点一点地死去。就你一个人。\"","sectionId":"s6","sectionNo":6,"sectionTitle":"井边的对话","sectionEn":"\"Aaaaaaaah, splat. Finished.\"","localIndex":3},{"en":"\"Yuck, just thinking about it makes my flesh creep. Somebody should find the thing and build a wall around it.\"","cn":"\"噫，光是想想就起鸡皮疙瘩。应该有人找到它，在周围砌一圈墙。\"","sectionId":"s6","sectionNo":6,"sectionTitle":"井边的对话","sectionEn":"\"Aaaaaaaah, splat. Finished.\"","localIndex":4},{"en":"\"But nobody can find it. So make sure you don't go off the path.\"","cn":"\"可是没人能找到它。所以千万别离开这条小路。\"","sectionId":"s6","sectionNo":6,"sectionTitle":"井边的对话","sectionEn":"\"Aaaaaaaah, splat. Finished.\"","localIndex":5},{"en":"Naoko took my hand. \"Don't you worry. You'll be O.K. You could go running all around here in the middle of the night and you'd never fall into the well. And as long as I stick with you, I won't fall in, either.\"","cn":"直子握住我的手。\"别担心。你不会有事的。就算你深更半夜在这周围到处乱跑，也绝不会掉进井里。而且只要我和你在一起，我也不会掉进去。\"","sectionId":"s7","sectionNo":7,"sectionTitle":"\"待在我身边\"","sectionEn":"The Cheek Touch · \"But it's impossible\"","localIndex":1},{"en":"\"Never?\" — \"Never!\" — \"How can you be so sure?\"","cn":"\"真的？\"\"真的！\"\"你怎么这么肯定？\"","sectionId":"s7","sectionNo":7,"sectionTitle":"\"待在我身边\"","sectionEn":"The Cheek Touch · \"But it's impossible\"","localIndex":2},{"en":"\"I just know. It's got nothing to do with logic: I just feel it. When I'm really close to you like this, I'm not the least bit scared. Nothing dark or evil could ever tempt me.\"","cn":"\"我就是知道。这跟逻辑没关系，就是感觉。像现在这样和你紧紧靠在一起的时候，我一点都不害怕。任何黑暗或邪恶都不能引诱我。\"","sectionId":"s7","sectionNo":7,"sectionTitle":"\"待在我身边\"","sectionEn":"The Cheek Touch · \"But it's impossible\"","localIndex":3},{"en":"\"All you have to do is stay with me like this all the time.\"","cn":"\"那不就解决了？你只要一直像我这样待在我身边就行了。\"","sectionId":"s7","sectionNo":7,"sectionTitle":"\"待在我身边\"","sectionEn":"The Cheek Touch · \"But it's impossible\"","localIndex":4},{"en":"\"Do you mean that?\" — \"Of course I mean it.\"","cn":"\"你是认真的吗？\"\"当然是认真的。\"","sectionId":"s7","sectionNo":7,"sectionTitle":"\"待在我身边\"","sectionEn":"The Cheek Touch · \"But it's impossible\"","localIndex":5},{"en":"Naoko stopped short. She put her hands on my shoulders and peered into my eyes. Deep within her own pupils a heavy, black liquid swirled in a strange whirlpool pattern. Then she stretched to her full height and touched her cheek to mine. It was a marvelous, warm gesture that stopped my heart for a moment.","cn":"直子突然停下。我也停下。她把双手搭在我肩上，凝神注视我的眼睛。在她瞳孔的深处，一种浓重的黑色液体以奇异的漩涡状旋转着。那双美丽的眼睛久久地注视着我。然后她踮起脚尖，将脸颊贴在我的脸颊上。那是一个美妙而温暖的举动，让我的心跳停了一瞬。","sectionId":"s7","sectionNo":7,"sectionTitle":"\"待在我身边\"","sectionEn":"The Cheek Touch · \"But it's impossible\"","localIndex":6},{"en":"\"Thank you.\" — \"My pleasure.\"","cn":"\"谢谢。\"\"荣幸之至。\"","sectionId":"s7","sectionNo":7,"sectionTitle":"\"待在我身边\"","sectionEn":"The Cheek Touch · \"But it's impossible\"","localIndex":7},{"en":"\"I'm so happy you said that. Really happy. But it's impossible.\"","cn":"\"你这么说让我太高兴了。真的高兴。但这是不可能的。\"","sectionId":"s7","sectionNo":7,"sectionTitle":"\"待在我身边\"","sectionEn":"The Cheek Touch · \"But it's impossible\"","localIndex":8},{"en":"\"It would be wrong—wrong for you, wrong for me.\"","cn":"\"那样不对——对你不对，对我也不对。\"","sectionId":"s8","sectionNo":8,"sectionTitle":"\"放松就会崩溃\"","sectionEn":"The Outburst · two logics collide","localIndex":1},{"en":"\"Don't you see? It's just not possible for one person to watch over another person for ever and ever. Say we got married. You'd have to go to work. Who's going to watch over me while you're away? What kind of equality would there be in that? Sooner or later you'd get sick of me. I couldn't stand that.\"","cn":"\"你不明白吗？一个人永远不可能一辈子守护另一个人。就算我们结了婚，你白天还得去上班吧。你不在的时候谁来守护我？那样的关系里还有什么平等可言？迟早你会厌烦我。我受不了那个。\"","sectionId":"s8","sectionNo":8,"sectionTitle":"\"放松就会崩溃\"","sectionEn":"The Outburst · two logics collide","localIndex":2},{"en":"\"Relax, let your guard down. You're all tensed up. Relax your body, and the rest of you will lighten up.\"","cn":"\"放松，别那么戒备。你太紧张了。放松身体，其他一切也会跟着轻松起来。\"","sectionId":"s8","sectionNo":8,"sectionTitle":"\"放松就会崩溃\"","sectionEn":"The Outburst · two logics collide","localIndex":3},{"en":"\"How can you say that?\" she asked in a voice drained of feeling.","cn":"\"你怎么能这么说？\"她用一种毫无感情的声音问道。","sectionId":"s8","sectionNo":8,"sectionTitle":"\"放松就会崩溃\"","sectionEn":"The Outburst · two logics collide","localIndex":4},{"en":"\"If I relaxed my body now, I'd fall apart. I've always lived like this, and it's the only way I know how to go on living. If I relaxed for a second, I'd never find my way back. I'd go to pieces, and the pieces would be blown away. Why can't you see that? How can you talk about watching over me if you can't see that?\"","cn":"\"我现在要是放松身体，整个人就会散掉。我一直就是这样活着的，这是我唯一知道如何活下去的方式。只要放松一秒钟，我就再也回不来了。我会变成碎片，被风吹走。为什么你就看不到这一点？连这都看不到，还说什么守护我？\"","sectionId":"s8","sectionNo":8,"sectionTitle":"\"放松就会崩溃\"","sectionEn":"The Outburst · two logics collide","localIndex":5},{"en":"I said nothing in return.","cn":"我无言以对。","sectionId":"s8","sectionNo":8,"sectionTitle":"\"放松就会崩溃\"","sectionEn":"The Outburst · two logics collide","localIndex":6},{"en":"\"How could you have slept with me that time? How could you have done such a thing? Why didn't you just leave me alone?\"","cn":"\"你为什么那天晚上和我睡了？你为什么要做那种事？为什么不让我一个人待着？\"","sectionId":"s8","sectionNo":8,"sectionTitle":"\"放松就会崩溃\"","sectionEn":"The Outburst · two logics collide","localIndex":7},{"en":"Now we were walking through the frightful silence of a pine wood. The desiccated corpses of cicadas that had died at the end of the summer littered the surface of the path, crunching beneath our shoes. As if searching for something we'd lost, Naoko and I continued slowly down the path in the woods.","cn":"此刻我们正穿越一片松林，四周是令人恐惧的寂静。夏末死去的蝉的干枯尸体散落在路面，在我们脚下嘎吱作响。仿佛在寻找某件我们丢失的东西，直子和我在林间小路上缓缓走着。","sectionId":"s9","sectionNo":9,"sectionTitle":"松林与蝉蜕","sectionEn":"Cicada Shells · apology, searching for something lost","localIndex":1},{"en":"\"I'm sorry. I didn't mean to hurt you. I was just angry at myself.\"","cn":"\"对不起。我不是有意要伤害你。我只是生自己的气。\"","sectionId":"s9","sectionNo":9,"sectionTitle":"松林与蝉蜕","sectionEn":"Cicada Shells · apology, searching for something lost","localIndex":2},{"en":"\"I guess I don't really understand you yet. I'm not all that smart. It takes me a while to understand things. But if I do have the time, I will come to understand you—better than anyone else in the world ever can.\"","cn":"\"我想我还是不够了解你。我不是那么聪明，需要时间才能理解一些事情。但如果我有足够的时间，我一定会理解你——比世界上任何人都理解得更好。\"","sectionId":"s9","sectionNo":9,"sectionTitle":"松林与蝉蜕","sectionEn":"Cicada Shells · apology, searching for something lost","localIndex":3},{"en":"We came to a stop and stood in the silent woods, listening. I tumbled pinecones and cicada shells with the toe of my shoe, then looked up at the patches of sky showing through the pine branches. Naoko stood there thinking, her eyes focused on nothing in particular.","cn":"我们停下来，站在寂静的树林中倾听。我用脚尖拨弄着松果和蝉壳，然后抬头仰望松枝间露出的一片片天空。直子双手插在夹克口袋里，站在那儿沉思，目光没有聚焦在任何事物上。","sectionId":"s9","sectionNo":9,"sectionTitle":"松林与蝉蜕","sectionEn":"Cicada Shells · apology, searching for something lost","localIndex":4},{"en":"\"Tell me something, Toru. Do you love me?\"","cn":"\"告诉我，渡边。你爱我吗？\"","sectionId":"s10","sectionNo":10,"sectionTitle":"两个愿望","sectionEn":"Two Wishes · \"Do you love me?\"","localIndex":1},{"en":"\"You know I do.\"","cn":"\"你知道我爱你。\"","sectionId":"s10","sectionNo":10,"sectionTitle":"两个愿望","sectionEn":"Two Wishes · \"Do you love me?\"","localIndex":2},{"en":"\"Will you do me two favors?\"","cn":"\"你能答应我两件事吗？\"","sectionId":"s10","sectionNo":10,"sectionTitle":"两个愿望","sectionEn":"Two Wishes · \"Do you love me?\"","localIndex":3},{"en":"\"You may have up to three wishes, madame.\"","cn":"\"最多可以许三个愿，小姐。\"","sectionId":"s10","sectionNo":10,"sectionTitle":"两个愿望","sectionEn":"Two Wishes · \"Do you love me?\"","localIndex":4},{"en":"Naoko smiled and shook her head. \"No, two will be enough. One is for you to realize how grateful I am that you came to see me here. I hope you'll understand how happy you've made me. I know it's going to save me if anything will.\"","cn":"直子笑了，摇摇头。\"不，两个就够了。第一件，希望你知道我有多感激你来看我。希望你明白你让我有多幸福。如果说有什么能拯救我，那就是这个了。我可能没有表现出来，但这是真的。\"","sectionId":"s10","sectionNo":10,"sectionTitle":"两个愿望","sectionEn":"Two Wishes · \"Do you love me?\"","localIndex":5},{"en":"\"I'll come to see you again. And what is the other wish?\"","cn":"\"我会再来看你的。第二件呢？\"","sectionId":"s10","sectionNo":10,"sectionTitle":"两个愿望","sectionEn":"Two Wishes · \"Do you love me?\"","localIndex":6},{"en":"\"I want you always to remember me. Will you remember that I existed, and that I stood next to you here like this?\"","cn":"\"我希望你永远记住我。答应我你会记住我存在过，记住我曾经这样站在你身边。\"","sectionId":"s10","sectionNo":10,"sectionTitle":"两个愿望","sectionEn":"Two Wishes · \"Do you love me?\"","localIndex":7},{"en":"\"Always. I'll always remember.\"","cn":"\"永远。我会永远记住。\"","sectionId":"s10","sectionNo":10,"sectionTitle":"两个愿望","sectionEn":"Two Wishes · \"Do you love me?\"","localIndex":8},{"en":"She walked on ahead without speaking. The autumn light filtering through the branches danced over the shoulders of her jacket.","cn":"她没说话，继续往前走。透过枝叶洒下的秋日阳光在她夹克的肩头跳动着。","sectionId":"s10","sectionNo":10,"sectionTitle":"两个愿望","sectionEn":"Two Wishes · \"Do you love me?\"","localIndex":9},{"en":"\"Come over here. The well might be around here somewhere.\" Naoko stopped and smiled and took my arm.","cn":"\"到这边来。井说不定就在这附近。\"直子停下，笑了，挽住我的胳膊。","sectionId":"s11","sectionNo":11,"sectionTitle":"永不忘记的承诺","sectionEn":"The Promise · \"I'll never forget you\"","localIndex":1},{"en":"\"Do you really promise never to forget me?\" she asked in a near whisper.","cn":"\"你真的保证永远不会忘记我吗？\"她用近乎耳语的声音问道。","sectionId":"s11","sectionNo":11,"sectionTitle":"永不忘记的承诺","sectionEn":"The Promise · \"I'll never forget you\"","localIndex":2},{"en":"\"I'll never forget you. I could never forget you.\"","cn":"\"我永远不会忘记你。我怎么可能忘记你呢。\"","sectionId":"s11","sectionNo":11,"sectionTitle":"永不忘记的承诺","sectionEn":"The Promise · \"I'll never forget you\"","localIndex":3},{"en":"EVEN SO, my memory has grown increasingly distant, and I have already forgotten any number of things. Writing from memory like this, I often feel a pang of dread. What if I've forgotten the most important thing? What if somewhere inside me there is a dark limbo where all the truly important memories are heaped and slowly turning into mud?","cn":"尽管如此，记忆还是越来越遥远了，我已经忘记了太多太多的事情。像这样凭记忆写作，我时常感到一阵恐惧。要是我忘掉了最重要的东西怎么办？要是我内心深处有一个黑暗的角落，所有真正重要的记忆都在那里堆积着，慢慢变成泥浆，那该怎么办？","sectionId":"s12","sectionNo":12,"sectionTitle":"不完美的容器","sectionEn":"Imperfect Vessel · \"Naoko never loved me\"","localIndex":1},{"en":"Clutching these faded, fading, imperfect memories to my breast, I go on writing this book with all the desperate intensity of a starving man sucking on bones. This is the only way I know to keep my promise to Naoko.","cn":"但不管怎样，我只能依靠这些。抱着这些已经褪色、正在褪色、不完整的记忆，我继续写着这本书，带着一个饥饿的人啃骨头的绝望。这是我所知道的、唯一能履行对直子的承诺的方法。","sectionId":"s12","sectionNo":12,"sectionTitle":"不完美的容器","sectionEn":"Imperfect Vessel · \"Naoko never loved me\"","localIndex":2},{"en":"Once, long ago, when I was still young, when the memories were far more vivid, I often tried to write about Naoko. But I was never able to produce a line. Everything was too sharp and clear, so that I could never tell where to start—the way a map that shows too much can sometimes be useless.","cn":"很久以前，当我还年轻、记忆远比现在鲜活的时侯，我常常试图写下直子。但我始终写不出一行字。我知道只要写下第一行，剩下的就会自己流泻出来，但我无论如何也做不到。一切都太清晰太尖锐了，我根本不知道从何下笔——就像一张地图画得太详细反而失去了用处。","sectionId":"s12","sectionNo":12,"sectionTitle":"不完美的容器","sectionEn":"Imperfect Vessel · \"Naoko never loved me\"","localIndex":3},{"en":"Now, though, I realize that all I can place in the imperfect vessel of writing are imperfect memories and imperfect thoughts. The more the memories of Naoko inside me fade, the more deeply I am able to understand her. She knew, of course. She knew that my memories of her would fade. Which is precisely why she begged me never to forget her, to remember that she had existed.","cn":"现在我明白了。我能放进写作这个不完美的容器的，只有不完美的记忆和不完美的思绪。直子在我心中的记忆越是褪色，我就越是深刻地理解她。当然，她自己也知道。她知道自己总有一天会被我遗忘。正因如此，她才恳求我永远不要忘记她，要记住她存在过。","sectionId":"s12","sectionNo":12,"sectionTitle":"不完美的容器","sectionEn":"Imperfect Vessel · \"Naoko never loved me\"","localIndex":4}];
const SECTIONS=[{"id":"s1","no":1,"title":"汉堡机场 · Norwegian Wood","enTitle":"Opening · 1987, a 747, the song that shatters","firstPara":0,"count":5},{"id":"s2","no":2,"title":"十八年前的草地","enTitle":"The Meadow · Autumn 1969, about to turn twenty","firstPara":5,"count":2},{"id":"s3","no":3,"title":"记忆的悖论","enTitle":"Memory · \"no one is in it\"","firstPara":7,"count":3},{"id":"s4","no":4,"title":"Naoko的面容","enTitle":"Her Face · shadows lengthening at dusk","firstPara":10,"count":4},{"id":"s5","no":5,"title":"田野之井","enTitle":"The Field Well · a dark opening a yard across","firstPara":14,"count":3},{"id":"s6","no":6,"title":"井边的对话","enTitle":"\"Aaaaaaaah, splat. Finished.\"","firstPara":17,"count":5},{"id":"s7","no":7,"title":"\"待在我身边\"","enTitle":"The Cheek Touch · \"But it's impossible\"","firstPara":22,"count":8},{"id":"s8","no":8,"title":"\"放松就会崩溃\"","enTitle":"The Outburst · two logics collide","firstPara":30,"count":7},{"id":"s9","no":9,"title":"松林与蝉蜕","enTitle":"Cicada Shells · apology, searching for something lost","firstPara":37,"count":4},{"id":"s10","no":10,"title":"两个愿望","enTitle":"Two Wishes · \"Do you love me?\"","firstPara":41,"count":9},{"id":"s11","no":11,"title":"永不忘记的承诺","enTitle":"The Promise · \"I'll never forget you\"","firstPara":50,"count":3},{"id":"s12","no":12,"title":"不完美的容器","enTitle":"Imperfect Vessel · \"Naoko never loved me\"","firstPara":53,"count":4}];
const STORAGE_KEY='nw_reader_companion_inline_ch01_v2';
const WORDBOOK_FILE=decodeURIComponent(location.pathname.split('/').pop()||'reader-companion-inline.html');
const irregular={be:['am','is','are','was','were','been','being'],go:['goes','went','gone','going'],have:['has','had','having'],do:['does','did','done','doing'],lose:['loses','lost','losing'],feel:['feels','felt','feeling'],think:['thinks','thought','thinking'],bring:['brings','brought','bringing'],begin:['begins','began','begun','beginning'],send:['sends','sent','sending'],make:['makes','made','making'],come:['comes','came','coming'],see:['sees','saw','seen','seeing'],say:['says','said','saying']};
const API='http://127.0.0.1:8765';
const reader=document.getElementById('reader');
const selectionBox=document.getElementById('selectionBox');
const selectionHelp=document.getElementById('selectionHelp');
const meaningInput=document.getElementById('meaningInput');
const noteInput=document.getElementById('noteInput');
const aiWordBtn=document.getElementById('aiWordBtn');
const parseBtn=document.getElementById('parseBtn');
const wordList=document.getElementById('wordList');
const sentenceBox=document.getElementById('sentenceBox');
const sectionNav=document.getElementById('sectionNav');
const actionMenu=document.getElementById('actionMenu');
const menuWordBtn=document.getElementById('menuWordBtn');
const menuSentenceBtn=document.getElementById('menuSentenceBtn');
const menuPronounceBtn=document.getElementById('menuPronounceBtn');
let state=loadState(),selectedText='';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanNote(s){return String(s||'').replace(/\\n/g,'\n')}
function loadState(){try{const current=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');const legacy=JSON.parse(localStorage.getItem('nw_reader_companion_inline_ch01_v1')||'null');const deleted=new Set([...(current&&Array.isArray(current.deletedWords)?current.deletedWords:[])]);const words={...(legacy&&legacy.words?legacy.words:{}),...(current&&current.words?current.words:{})};deleted.forEach(w=>delete words[w]);return{words,deletedWords:[...deleted]}}catch{return{words:{},deletedWords:[]}}}
function localSaveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
async function persistWordbook(){localSaveState();try{await postJson(API+'/api/wordbook?file='+encodeURIComponent(WORDBOOK_FILE),state)}catch(e){console.warn('wordbook json save failed',e)}}
function saveState(){localSaveState();renderReader();renderWordList();persistWordbook()}
async function loadWordbookFile(){try{const res=await fetch(API+'/api/wordbook?file='+encodeURIComponent(WORDBOOK_FILE));if(!res.ok)return;const remote=await res.json();if(remote&&remote.words){const deleted=new Set([...(state.deletedWords||[]),...(Array.isArray(remote.deletedWords)?remote.deletedWords:[])]);state={words:{...state.words,...remote.words},deletedWords:[...deleted]};state.deletedWords.forEach(w=>delete state.words[w]);localSaveState();renderReader();renderWordList();updateSectionNav();persistWordbook();toast('已加载本地单词本')}}catch(e){console.warn('wordbook json load failed',e)}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2400)}
function renderReader(){reader.innerHTML=PARAS.map((p,i)=>{const sec=SECTIONS.find(s=>s.firstPara===i);const marker=sec?'<div class="section-marker" id="'+sec.id+'"><div class="kicker">PART '+sec.no+' · '+sec.count+' 段</div><h2>'+esc(sec.title)+'</h2><p>'+esc(sec.enTitle)+'</p></div>':'';return marker+'<article class="para" data-section="'+p.sectionId+'" data-i="'+i+'"><div class="en" data-i="'+i+'">'+highlight(esc(p.en))+'</div>'+(p.cn?'<div class="cn">'+esc(p.cn)+'</div>':'')+'</article>'}).join('');document.querySelectorAll('.hl-word').forEach(x=>x.addEventListener('click',showTip));updateSectionNav()}
function renderSectionNav(){if(!sectionNav)return;sectionNav.innerHTML='<div class="nav-title">挪威的森林<span class="nav-progress" id="navProgress">第一章 · '+SECTIONS.length+'段</span></div><div class="nav-list">'+SECTIONS.map(s=>'<button class="nav-link" type="button" data-section="'+s.id+'"><span class="num">'+s.no+'</span><span class="name">'+esc(s.title.replace(/ · .*/,''))+'</span><span class="meta">'+esc(s.enTitle)+' · '+s.count+' 段</span></button>').join('')+'</div><div class="nav-footer">村上春树</div>';sectionNav.querySelectorAll('.nav-link').forEach(btn=>btn.onclick=()=>{const target=document.getElementById(btn.dataset.section);if(target)target.scrollIntoView({behavior:'smooth',block:'start'})})}
function updateSectionNav(){if(!sectionNav||!SECTIONS.length)return;if(!sectionNav.querySelector('.nav-link'))renderSectionNav();const readerTop=reader.getBoundingClientRect().top+18;let current=SECTIONS[0];document.querySelectorAll('.section-marker').forEach(marker=>{if(marker.getBoundingClientRect().top-readerTop<=8){const found=SECTIONS.find(s=>s.id===marker.id);if(found)current=found}});sectionNav.querySelectorAll('.nav-link').forEach(btn=>{const sec=SECTIONS.find(s=>s.id===btn.dataset.section);btn.classList.toggle('active',sec&&sec.id===current.id);btn.classList.toggle('past',sec&&sec.no<current.no)});const progress=document.getElementById('navProgress');if(progress)progress.textContent='第 '+current.no+' / '+SECTIONS.length+' 段 · '+current.title.replace(/ · .*/,'')}
function formsFor(base){const set=new Set([base]);const saved=state.words[base];if(saved&&Array.isArray(saved.forms))saved.forms.forEach(x=>set.add(String(x).toLowerCase()));if(saved&&saved.ai&&Array.isArray(saved.ai.forms))saved.ai.forms.forEach(x=>set.add(String(x).toLowerCase()));if(irregular[base])irregular[base].forEach(x=>set.add(x));if(base.endsWith('y')&&!/[aeiou]y$/.test(base)){set.add(base.slice(0,-1)+'ies');set.add(base.slice(0,-1)+'ied')}else{set.add(base+'s');set.add(base+'ed')}if(base.endsWith('e')&&!base.endsWith('ee'))set.add(base.slice(0,-1)+'ing');else set.add(base+'ing');return[...set].filter(x=>x.length>1)}
function rxEsc(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function highlight(text){const entries=Object.values(state.words).filter(w=>w&&w.base);if(!entries.length)return text;const map=new Map();entries.forEach(w=>formsFor(w.base).forEach(f=>map.set(String(f).toLowerCase(),w.base)));const pattern=[...map.keys()].filter(x=>/^[a-zA-Z']+$/.test(x)).sort((a,b)=>b.length-a.length).map(rxEsc).join('|');if(!pattern)return text;return text.replace(new RegExp('\\b('+pattern+')\\b','gi'),m=>{const b=map.get(m.toLowerCase());const item=state.words[b]||{};return '<span class="hl-word '+(item.mastered?'mastered':'')+'" data-base="'+esc(b)+'">'+m+'</span>'})}
function normalizeWord(t){const m=String(t||'').trim().match(/^[A-Za-z]+(?:['’-][A-Za-z]+)?$/);return m?m[0].toLowerCase().replace(/[’']/g,"'"):''}
function readReaderSelection(){const sel=window.getSelection();const t=sel?String(sel).trim():'';if(!t||!sel.rangeCount)return'';const node=sel.getRangeAt(0).commonAncestorContainer;const el=node.nodeType===1?node:node.parentElement;if(!el||!reader.contains(el))return'';return t.replace(/\s+/g,' ').trim()}
function captureSelection(){const t=readReaderSelection();if(!t)return;selectedText=t;selectionBox.textContent=selectedText;const w=normalizeWord(selectedText);selectionHelp.textContent=w?'已选中单词：'+w+'。可以点 AI 查词自动保存。':'已选中一句/一段文字，可以拆解句子。';if(w&&state.words[w]){meaningInput.value=state.words[w].meaning||'';noteInput.value=cleanNote(state.words[w].note||'')}}
document.addEventListener('selectionchange',captureSelection);
async function postJson(url,body){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'请求失败');return data}
function currentContext(){const sel=window.getSelection();if(sel&&sel.rangeCount){const node=sel.getRangeAt(0).commonAncestorContainer;const el=node.nodeType===1?node:node.parentElement;const en=el?el.closest('.en'):null;if(en&&reader.contains(en))return en.innerText}return selectedText}
async function runAiWordLookup(){const base=normalizeWord(selectedText);if(!base){toast('先在左侧拖选一个英文单词');return}aiWordBtn.disabled=true;aiWordBtn.textContent='AI 查词中...';try{const data=await postJson(API+'/api/word',{word:base,context:currentContext()});const key=data.base||base;state.words[key]={base:key,meaning:[data.partOfSpeech,data.meaningZh].filter(Boolean).join(' '),note:[data.memoryHintZh||'',data.exampleEn||'',data.exampleZh||''].filter(Boolean).join('\n'),forms:Array.isArray(data.forms)?data.forms:[],mastered:false,createdAt:Date.now(),ai:data};selectedText=key;selectionBox.textContent=key;meaningInput.value=state.words[key].meaning;noteInput.value=cleanNote(state.words[key].note);saveState();toast('已查词并保存')}catch(e){toast('AI 查词失败：'+e.message)}finally{aiWordBtn.disabled=false;aiWordBtn.textContent='AI 查词'}}
aiWordBtn.onclick=runAiWordLookup;
function renderWordList(){const words=Object.values(state.words).sort((a,b)=>a.base.localeCompare(b.base));wordList.innerHTML=words.length?words.map(w=>'<div class="word-item '+(w.mastered?'mastered':'')+'" data-word="'+esc(w.base)+'"><div class="word-head"><strong>'+esc(w.base)+'</strong><button class="word-delete" type="button" title="删除" aria-label="删除 '+esc(w.base)+'">删除</button></div><span>'+esc(w.meaning||'待补充中文')+'</span><span>'+formsFor(w.base).slice(0,8).map(esc).join(' / ')+'</span></div>').join(''):'<p class="small">还没有单词。</p>';wordList.querySelectorAll('.word-item').forEach(el=>{el.onclick=e=>{if(e.target.closest('.word-delete'))return;const w=state.words[el.dataset.word];selectedText=w.base;selectionBox.textContent=w.base;meaningInput.value=w.meaning||'';noteInput.value=cleanNote(w.note||'')};el.ondblclick=e=>{if(e.target.closest('.word-delete'))return;state.words[el.dataset.word].mastered=!state.words[el.dataset.word].mastered;saveState()}});wordList.querySelectorAll('.word-delete').forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const item=btn.closest('.word-item');const word=item&&item.dataset.word;if(!word)return;delete state.words[word];state.deletedWords=[...(state.deletedWords||[]).filter(x=>x!==word),word];try{const legacy=JSON.parse(localStorage.getItem('nw_reader_companion_inline_ch01_v1')||'null');if(legacy&&legacy.words&&legacy.words[word]){delete legacy.words[word];localStorage.setItem('nw_reader_companion_inline_ch01_v1',JSON.stringify(legacy))}}catch{}if(selectedText===word){selectedText='';selectionBox.textContent='还没有选择文本。';meaningInput.value='';noteInput.value=''}saveState();toast('已删除：'+word)}})}
function closeTips(){document.querySelectorAll('.tip').forEach(x=>x.remove())}
function showTip(e){e.stopPropagation();const b=e.currentTarget.dataset.base,w=state.words[b];closeTips();const tip=document.createElement('div');tip.className='tip';tip.innerHTML='<button class="tip-close" type="button" aria-label="关闭">×</button><b>'+esc(b)+'</b><button class="tip-speak" type="button">发音</button><br>'+esc(w.meaning||'待补充中文')+'<br><small>'+esc(cleanNote(w.note||''))+'</small>';document.body.appendChild(tip);tip.querySelector('.tip-close').onclick=closeTips;tip.querySelector('.tip-speak').onclick=()=>speakWord(b);const r=e.currentTarget.getBoundingClientRect();tip.style.left=Math.min(Math.max(8,r.left),innerWidth-328)+'px';tip.style.top=Math.max(8,r.bottom+8)+'px'}
document.addEventListener('click',e=>{if(!e.target.closest('.tip')&&!e.target.closest('.hl-word'))closeTips()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTips()});
reader.addEventListener('scroll',closeTips);
async function runAiSentenceParse(){captureSelection();const sentence=(readReaderSelection()||selectedText||'').replace(/\s+/g,' ').trim();if(!sentence||sentence.split(/\s+/).length<5){toast('先选中一句英文长句');return}selectedText=sentence;selectionBox.textContent=sentence;parseBtn.disabled=true;parseBtn.textContent='AI 拆解中...';try{const data=await postJson(API+'/api/sentence',{sentence});const arr=x=>Array.isArray(x)?x:[];sentenceBox.innerHTML='<div class="parse-block"><b>原句</b><br>'+esc(data.original||sentence)+'</div><div class="parse-block"><b>主干</b><br>'+esc(data.mainClause||'')+'<br>主语：'+esc(data.subject||'')+'<br>谓语：'+esc(data.predicate||'')+'</div><div class="parse-block"><b>宾语 / 补足语</b><br>'+arr(data.objectsOrComplements).map(esc).join('<br>')+'</div><div class="parse-block"><b>修饰成分</b><br>'+arr(data.modifiers).map(esc).join('<br>')+'</div><div class="parse-block"><b>从句</b><br>'+(arr(data.clauses).length?arr(data.clauses).map(esc).join('<br>'):'无明显从句')+'</div><div class="parse-block"><b>重点词组</b><br>'+arr(data.phrases).map(esc).join('<br>')+'</div><div class="parse-block"><b>简单英文</b><br>'+esc(data.simpleEnglish||'')+'</div><div class="parse-block"><b>中文意思</b><br>'+esc(data.translationZh||'')+'</div><div class="parse-block"><b>学习点</b><br>'+esc(data.learningPointZh||'')+'</div>'}catch(e){toast('AI 拆句失败：'+e.message)}finally{parseBtn.disabled=false;parseBtn.textContent='AI 拆解句子'}}
parseBtn.onclick=runAiSentenceParse;
function selectedPronounceWord(){const exact=normalizeWord(selectedText);if(exact)return exact;const m=String(selectedText||'').match(/[A-Za-z]+(?:['’-][A-Za-z]+)?/);return m?normalizeWord(m[0]):''}
function speakWord(word){const w=word||selectedPronounceWord();if(!w){toast('先选中一个英文单词');return}if(!('speechSynthesis' in window)){toast('当前浏览器不支持发音');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.86;u.pitch=1;speechSynthesis.speak(u);toast('发音：'+w)}
function closeActionMenu(){actionMenu.classList.remove('show')}
function openActionMenu(x,y){captureSelection();if(!selectedText){toast('先选中英文单词或句子');return}actionMenu.style.left=Math.min(x,innerWidth-140)+'px';actionMenu.style.top=Math.min(y,innerHeight-92)+'px';actionMenu.classList.add('show')}
reader.addEventListener('contextmenu',e=>{const text=readReaderSelection();if(!text)return;e.preventDefault();selectedText=text;selectionBox.textContent=selectedText;openActionMenu(e.clientX,e.clientY)});
menuWordBtn.onclick=()=>{closeActionMenu();runAiWordLookup()};
menuSentenceBtn.onclick=()=>{closeActionMenu();runAiSentenceParse()};
menuPronounceBtn.onclick=()=>{closeActionMenu();speakWord()};
document.addEventListener('click',e=>{if(!e.target.closest('.action-menu'))closeActionMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeActionMenu()});
reader.addEventListener('scroll',closeActionMenu);
reader.addEventListener('scroll',updateSectionNav);
renderSectionNav();renderReader();renderWordList();updateSectionNav();loadWordbookFile();
</script>
</body>
</html>
