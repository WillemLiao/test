<div class="container">
<div class="hero"><div class="ch">CHAPTER 36</div><h1>幸福需要活在当下</h1><div class="sub">纳瓦尔宝典 · The Almanack of Naval Ravikant</div></div>
<div class="body">
  <div class="highlight">大脑只有很小一部分是关注当下的。如果每天都沉浸在对未来的规划和幻想中，就是在亲手扼杀自己的幸福。</div>
  <div class="qbox"><div class="big">"思考的间隙即开悟。"</div></div>
  <div class="card"><div class="card-body"><strong>过去就是过去了</strong>，没有回忆，没有遗憾，没有放不下的人，没有忘不掉的旅行。既往不恋。</div></div>
  <div class="card"><div class="card-body">人之所以感到痛苦，很多时候是因为<strong>拿以往和现在做比较</strong>。以往种种未能实现的欲念会带来现在的缺憾感，又将弥补缺憾的希望寄托于未来。</div></div>
  <div class="card"><div class="card-body" style="text-align:center;font-size:15px;">现在的生活可能就是上帝承诺给你的天堂，<br>而你却毫不珍惜，肆意挥霍。</div></div>
</div>
<div class="footer">— 纳瓦尔宝典 · 第 36 章 —</div>
</div>
